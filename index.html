<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARKA – Armoire de Ressources Connectée et Autonome</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%2314213D'/%3E%3Cpath d='M30 96 L60 20 L90 96' fill='none' stroke='%23F5F3EE' stroke-width='11' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='44' y1='72' x2='76' y2='72' stroke='%23F5F3EE' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --navy:#14213D; --navy-deep:#0B1426; --navy-2:#1B2B4D; --navy-3:#24375F;
  --orange:#E8833A; --orange-dark:#B35A17; --green:#2A9D8F; --green-l:#3FC1B0;
  --red:#E05A4A; --amber:#E9B949; --ivory:#F5F3EE; --stone:#E9E6DF;
  --ink-soft:#4A5468; --line:#D6D2C8; --muted-d:#9AA6BF;
  --font-display:"Syne","Trebuchet MS",sans-serif; --font-body:"DM Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);font-size:15px;line-height:1.5}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- Tableau de bord (salle de contrôle, sombre) ---------- */
body.dash{background:var(--navy-deep);color:var(--ivory)}
.dash header{display:flex;align-items:center;gap:20px;padding:16px 28px;background:var(--navy);border-bottom:1px solid var(--navy-3);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.brand svg{width:40px;height:40px}
.brand b{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:.14em}
.brand span{font-size:13px;color:var(--muted-d);display:block;letter-spacing:0}
.clock{font-family:var(--font-display);font-weight:700;font-size:22px;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-weight:500;font-size:14px}
.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.pill.ok{background:rgba(63,193,176,.15);color:var(--green-l)}
.pill.warn{background:rgba(233,185,73,.15);color:var(--amber)}
.pill.danger{background:rgba(224,90,74,.18);color:#FF8A7A}
.pill.off{background:rgba(154,166,191,.15);color:var(--muted-d)}
.tabs{display:flex;gap:4px;padding:12px 28px 0;background:var(--navy);border-bottom:1px solid var(--navy-3);overflow-x:auto}
.tabs button{background:none;border:0;color:var(--muted-d);padding:10px 16px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ivory)}
.tabs button[aria-selected="true"]{color:var(--ivory);border-bottom-color:var(--orange);font-weight:500}
.dash main{padding:24px 28px 48px;max-width:1400px;margin:0 auto}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--navy);border:1px solid var(--navy-3);border-radius:16px;padding:20px}
.card h2{font-family:var(--font-display);font-weight:700;font-size:17px;margin:0 0 14px}
.kpi .v{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1}
.kpi .v small{font-size:17px;font-weight:600;margin-left:4px}
.kpi .l{color:var(--muted-d);margin-top:8px;font-size:14px}
.kpi .s{margin-top:10px;font-size:13px}
.c-ok{color:var(--green-l)} .c-warn{color:var(--amber)} .c-danger{color:#FF8A7A} .c-mut{color:var(--muted-d)}
.chart svg{width:100%;height:110px;display:block}
.chart .cap{display:flex;justify-content:space-between;color:var(--muted-d);font-size:12px;margin-top:6px}
.dash table{width:100%;border-collapse:collapse;font-size:14px}
.dash th,.dash td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--navy-3)}
.dash th{color:var(--muted-d);font-weight:500;font-size:13px}
.dash tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;margin:1px 3px 1px 0}
.dash .tag{background:var(--navy-3);color:var(--ivory)}
.dash .tag.ok{background:rgba(63,193,176,.18);color:var(--green-l)}
.dash .tag.warn{background:rgba(233,185,73,.18);color:var(--amber)}
.dash .tag.danger{background:rgba(224,90,74,.2);color:#FF8A7A}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.pers{border-radius:12px;padding:12px 14px;background:var(--navy-2);border:1px solid var(--navy-3);border-left-width:4px}
.pers.vert{border-left-color:var(--green-l)} .pers.orange{border-left-color:var(--amber)} .pers.rouge{border-left-color:var(--red);background:#2A2238}
.pers .n{font-weight:500} .pers .p{font-size:12px;color:var(--muted-d)}
.pers .vit{display:flex;gap:10px;font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
.pers .cond{font-size:12px;margin-top:6px}
.bar{height:8px;border-radius:999px;background:var(--navy-3);overflow:hidden;min-width:60px}
.bar span{display:block;height:100%;border-radius:999px;background:var(--green-l)}
.bar span.warn{background:var(--amber)} .bar span.danger{background:var(--red)}
.cascade{border-bottom:1px solid var(--navy-3);padding:12px 0}
.cascade:last-child{border-bottom:0}
.cascade .root{font-weight:500;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.cascade .step{font-size:13px;color:#C9CEDA;padding:3px 0;display:flex;gap:8px}
.cascade .step::before{content:"↳";color:var(--orange)}
.when{font-size:12px;color:var(--muted-d);white-space:nowrap;font-variant-numeric:tabular-nums}
.banner{margin:0 0 18px;padding:12px 16px;border-radius:12px;background:rgba(233,185,73,.15);color:var(--amber)}
.empty{color:var(--muted-d);padding:8px 0}
.foot{color:var(--muted-d);font-size:13px;margin-top:28px}
.foot a{color:var(--muted-d)}

/* ---------- Console admin (claire, séparée) ---------- */
body.admin{background:var(--stone);color:var(--navy)}
.admin header{display:flex;align-items:center;gap:16px;padding:16px 28px;background:var(--ivory);border-bottom:1px solid var(--line);flex-wrap:wrap}
.admin header .brand span{color:var(--ink-soft)}
.admin main{padding:24px 28px 56px;max-width:1300px;margin:0 auto}
.admin .card{background:var(--ivory);border:1px solid var(--line)}
.admin .muted{color:var(--ink-soft);font-size:14px}
.admin table{width:100%;border-collapse:collapse;font-size:14px}
.admin th,.admin td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.admin th{color:var(--ink-soft);font-weight:500;font-size:13px}
.admin .tag{background:var(--stone);color:var(--navy)}
.admin .tag.ok{background:#D4EFEA;color:#1D6F65}
.admin .tag.warn{background:#FBE3D0;color:#8A4410}
.admin .tag.danger{background:#F6D5D1;color:#8E2A1F}
.admin .cascade{border-color:var(--line)}
.admin .cascade .step{color:var(--ink-soft)}
.admin .when{color:var(--ink-soft)}
.admin .pill.ok{background:#D4EFEA;color:#1D6F65}
.admin .pill.warn{background:#FBE3D0;color:#8A4410}
.admin .pill.danger{background:#F6D5D1;color:#8E2A1F}
.admin .pill.off{background:var(--line);color:var(--ink-soft)}
.btn{border:0;border-radius:10px;padding:10px 16px;min-height:44px;background:var(--navy);color:var(--ivory);font-weight:500}
.btn:hover{background:var(--navy-deep)}
.btn.sec{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn.sec:hover{background:var(--stone)}
.btn.warn{background:var(--orange-dark)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.btn[aria-pressed="true"]{background:var(--orange-dark);color:#fff;border-color:var(--orange-dark)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crise{border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.crise.active{border-color:var(--orange-dark);background:#FFF6EE}
.crise h3{margin:0;font-size:15px}
.crise p{margin:0;font-size:13px;color:var(--ink-soft)}
.admin label{font-weight:500;font-size:14px}
.admin select,.admin input[type=number],.admin input[type=password],.admin input[type=text]{font:inherit;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--navy)}
.field{display:flex;flex-direction:column;gap:6px}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0 12px}
.checks label{font-weight:400;display:flex;gap:6px;align-items:center}
fieldset{border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 12px}
legend{font-weight:500;font-size:14px;padding:0 6px}
.login{max-width:420px;margin:12vh auto;background:var(--ivory);border:1px solid var(--line);border-radius:20px;padding:32px}
.login h1{font-family:var(--font-display);margin:0 0 6px;font-size:26px}
.err{color:#A32D2D;font-size:14px}
.info{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;background:transparent;color:inherit;opacity:.65;font:600 12px/1 var(--font-body);font-style:italic;padding:0;margin-left:6px;vertical-align:middle;cursor:pointer}
.info:hover,.info[aria-expanded="true"]{opacity:1;color:var(--orange)}
#pop{position:fixed;z-index:50;max-width:320px;background:#0B1426;color:#F5F3EE;border:1px solid #E8833A;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.intro{color:var(--muted-d);margin:0 0 18px;max-width:80ch}
.admin .intro{color:var(--ink-soft)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--navy-3);font-size:14px}
.admin .feed li{border-color:var(--line)}
.feed li:last-child{border-bottom:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted-d);margin:0 0 14px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.zone{border-radius:12px;padding:14px;background:var(--navy-2);border:1px solid var(--navy-3)}
.zone.vide{border-style:dashed;opacity:.8}
.zone .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.zone .top b{white-space:nowrap}
.admin .c-mut,.admin .empty{color:var(--ink-soft)}
.me{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr))}
.big{font-family:var(--font-display);font-weight:700;font-size:22px}
.rep{margin-top:12px;padding:12px 14px;border-radius:10px}
.rep.ok{background:#D4EFEA;color:#1D6F65}.rep.no{background:#F6D5D1;color:#8E2A1F}
@media (max-width:1000px){.me{grid-template-columns:1fr}}
.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:var(--ivory);padding:12px 18px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:360px}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2{grid-template-columns:1fr}}
@media (max-width:560px){.g4{grid-template-columns:1fr}.dash main,.admin main{padding:18px 14px}.dash header,.admin header{padding:12px 14px}.tabs{padding:8px 14px 0}}
</style>

<body>
<div id="root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="pop" role="tooltip" hidden></div>

<script>
/* =====================================================================
   ARKA – simulation du vaisseau (secteurs alimentation et infirmerie)
   Principe repris du projet « Vaisseau OS » :
   - un état global, une partie par module (armoire, cuisine, infirmerie)
   - chaque module n'écrit que dans sa propre partie
   - les modules communiquent uniquement par un bus d'événements
   - chaque événement connaît sa cause : le journal affiche la cascade
     « crise → effet → effet »
   - une boucle fait avancer le vaisseau (1 seconde = 10 minutes à bord)
   ===================================================================== */

/*ENGINE-START*/
const MIN_PAR_TICK = 10;
const REPAS = [{ h: 420, nom: "Petit-déjeuner" }, { h: 750, nom: "Déjeuner" }, { h: 1140, nom: "Dîner" }];

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = mulberry32(42);
const hhmmM = (t) => { const m = t % 1440; return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };
const clone = (o) => JSON.parse(JSON.stringify(o));

const PRODUITS = {
  poulet:   { nom: "Poulet riz halal",        zone: "froid", kcal: 540, allergenes: [],                   tags: ["halal"],                       leger: false, dureeJ: 7 },
  bolo:     { nom: "Pâtes bolognaise",        zone: "froid", kcal: 580, allergenes: ["gluten"],           tags: [],                              leger: false, dureeJ: 6 },
  poisson:  { nom: "Poisson et purée",        zone: "froid", kcal: 480, allergenes: ["poisson", "lactose"], tags: [],                            leger: false, dureeJ: 5 },
  tofu:     { nom: "Tofu sauté aux légumes",  zone: "froid", kcal: 430, allergenes: ["soja"],             tags: ["végétarien", "vegan", "halal"], leger: false, dureeJ: 8 },
  omelette: { nom: "Omelette pommes de terre", zone: "froid", kcal: 460, allergenes: ["œuf"],             tags: ["végétarien", "halal"],         leger: false, dureeJ: 6 },
  curry:    { nom: "Curry de lentilles",      zone: "sec",   kcal: 420, allergenes: [],                   tags: ["végétarien", "vegan", "halal"], leger: false, dureeJ: 90 },
  riz:      { nom: "Riz aux légumes",         zone: "sec",   kcal: 380, allergenes: [],                   tags: ["végétarien", "vegan", "halal"], leger: true,  dureeJ: 120 },
  soupe:    { nom: "Soupe de légumes",        zone: "sec",   kcal: 200, allergenes: [],                   tags: ["végétarien", "vegan", "halal"], leger: true,  dureeJ: 120 }
};

PRODUITS.legumes = { nom: "Légumes frais de la serre", zone: "froid", kcal: 260, allergenes: [], tags: ["végétarien", "vegan", "halal"], leger: true, dureeJ: 5 };

// Armoire à graines : stock de départ, seuil d'alerte, graines utilisées par semis, durée de culture
const GRAINES = {
  laitue:   { nom: "Laitue",         stock: 30, seuil: 10, parSemis: 6,  cycleJ: 1.2 },
  tomate:   { nom: "Tomate",         stock: 24, seuil: 8,  parSemis: 5,  cycleJ: 1.8 },
  pdt:      { nom: "Pomme de terre", stock: 40, seuil: 12, parSemis: 8,  cycleJ: 2.2 },
  ble:      { nom: "Blé",            stock: 60, seuil: 20, parSemis: 12, cycleJ: 2.5 },
  soja:     { nom: "Soja",           stock: 30, seuil: 10, parSemis: 6,  cycleJ: 2 },
  lentille: { nom: "Lentille",       stock: 30, seuil: 10, parSemis: 6,  cycleJ: 2 }
};
const ZONES_INIT = [["A1", "laitue"], ["A2", "tomate"], ["B1", "pdt"], ["B2", "ble"], ["C1", "soja"], ["C2", "lentille"]];
const RECOLTE_PORTIONS = 25;

// Médicaments en libre-service à la MedBox (délai minimum entre deux prises)
const LIBRE_SERVICE = {
  paracetamol: { intervalle: 360, raisons: ["Mal de tête", "Fièvre", "Douleur"] },
  antihistaminique: { intervalle: 480, raisons: ["Allergie saisonnière", "Démangeaisons", "Nez qui coule"] }
};

const MEDS = {
  paracetamol:      { nom: "Paracétamol 1 g",            allergene: null,          reserve: 300, medbox: 30, seuil: 12 },
  amoxicilline:     { nom: "Amoxicilline 1 g",           allergene: "pénicilline", reserve: 80,  medbox: 12, seuil: 5 },
  azithromycine:    { nom: "Azithromycine 500 mg",       allergene: null,          reserve: 40,  medbox: 6,  seuil: 3 },
  sro:              { nom: "Sels de réhydratation",      allergene: null,          reserve: 150, medbox: 20, seuil: 8 },
  ondansetron:      { nom: "Antiémétique",               allergene: null,          reserve: 60,  medbox: 10, seuil: 4 },
  adrenaline:       { nom: "Adrénaline auto-injecteur",  allergene: null,          reserve: 10,  medbox: 2,  seuil: 1 },
  antihistaminique: { nom: "Antihistaminique",           allergene: null,          reserve: 80,  medbox: 10, seuil: 4 },
  insuline:         { nom: "Insuline (dose)",            allergene: null,          reserve: 40,  medbox: 4,  seuil: 2 }
};

const ALLERGENES = ["arachide", "gluten", "lactose", "fruits à coque", "œuf", "poisson", "soja", "pénicilline", "aspirine"];
const REGIMES = ["végétarien", "vegan", "halal"];
const MALADIES = ["diabète", "maladie cœliaque", "hypertension"];

const EQUIPAGE_INIT = [
  ["e1", "Lina Moreau", "Médecine", ["pénicilline"], [], []],
  ["e2", "Yanis Benali", "Agriculture", ["arachide"], ["halal"], []],
  ["e3", "Sofia Almeida", "Repas", ["gluten"], ["végétarien"], ["maladie cœliaque"]],
  ["e4", "Marc Delaunay", "Robotique", [], [], ["diabète"]],
  ["e5", "Inès Haddad", "Repas", ["lactose"], ["halal"], []],
  ["e6", "Tom Lefèvre", "Pilier central", [], [], []],
  ["e7", "Amina Diallo", "Médecine", [], ["halal"], []],
  ["e8", "Hugo Martin", "Agriculture", ["poisson"], [], []],
  ["e9", "Chloé Bernard", "Repas", [], ["vegan"], []],
  ["e10", "Karim Saïdi", "Robotique", ["arachide", "fruits à coque"], [], []],
  ["e11", "Léa Rousseau", "Agriculture", [], ["végétarien"], []],
  ["e12", "Nathan Petit", "Pilier central", ["aspirine"], [], ["hypertension"]],
  ["e13", "Sarah Cohen", "Médecine", [], [], []],
  ["e14", "Mehdi Amrani", "Repas", [], ["halal"], []],
  ["e15", "Emma Girard", "Robotique", ["lactose"], [], []],
  ["e16", "Lucas Fontaine", "Agriculture", [], [], []],
  ["e17", "Jade Nguyen", "Pilier central", ["pénicilline"], ["végétarien"], []],
  ["e18", "Rayan Belkacem", "Robotique", [], ["halal"], []],
  ["e19", "Manon Dubois", "Repas", ["œuf"], [], []],
  ["e20", "Adam Mercier", "Médecine", [], [], []]
].map(([id, nom, pilier, allergies, regimes, maladies]) => ({ id, nom, pilier, allergies, regimes, maladies }));

const CRISES = {
  "panne-frigo": { titre: "Panne du compartiment réfrigéré", desc: "Le compresseur s'arrête : la température monte, les lots frais sont perdus, l'autonomie en repas baisse et la cuisine peut passer en rationnement." },
  "intoxication": { titre: "Lot alimentaire contaminé", desc: "Un lot frais est contaminé sans que personne ne le sache. Après le prochain repas, des cas arrivent à l'infirmerie, qui remonte jusqu'au lot grâce à la traçabilité." },
  "etiquetage": { titre: "Erreur d'étiquetage allergène", desc: "Un lot contient de l'arachide non déclarée. Un membre allergique fait une réaction : adrénaline de la MedBox, puis retrait du lot." },
  "epidemie": { titre: "Épidémie de grippe", desc: "Cinq membres tombent malades et la contagion se propage. Plus de médicaments consommés, MedBox réapprovisionnée, repas retardés si l'équipe cuisine est touchée." },
  "rupture": { titre: "Rupture de paracétamol en réserve", desc: "La réserve de l'armoire tombe presque à zéro : la prévision d'autonomie chute et la MedBox ne peut plus être réapprovisionnée." },
  "maladie-cultures": { titre: "Maladie des cultures", desc: "Un champignon attaque deux zones de la serre. CropGuard le détecte à la prochaine analyse des photos : zones arrachées, graines sorties de l'armoire pour replanter, récolte perdue." }
};

function etatInitial() {
  const t0 = 6 * 60;
  const lots = [];
  let n = 1;
  const ajout = (pid, portions, decalageJ = 0) => {
    const p = PRODUITS[pid];
    lots.push({ id: "L" + String(n++).padStart(3, "0"), pid, portions, peremption: t0 + (p.dureeJ + decalageJ) * 1440, expo: 0, statut: "ok", allergenesReels: [...p.allergenes], contamine: false });
  };
  ajout("poulet", 40, -3); ajout("poulet", 40, 1); ajout("bolo", 70); ajout("poisson", 50);
  ajout("tofu", 60); ajout("omelette", 60); ajout("curry", 120); ajout("riz", 140); ajout("soupe", 100);
  const reserve = {}, medbox = {}, seuils = {};

let S = etatInitial();
const evRefs = new Map();  // événements récents gardés en mémoire pour relier les causes
const causes = {};         // dernières causes connues (panne, épidémie...)

/* ---------- Bus d'événements avec traçage de causalité ---------- */
function creerBus() {
  const abonnes = [];
  const file = [];
  let enCours = false;
  const correspond = (motif, type) => motif === "*" || motif === type || (motif.endsWith(".*") && type.startsWith(motif.slice(0, -1)));
  return {
    on(motif, fn) { abonnes.push({ motif, fn }); },
    publish(type, data = {}, o = {}) {
      const cause = o.cause || null;
      const depth = cause ? cause.depth + 1 : 0;
      if (depth > 12) return null;
      const label = o.label || o.message || type;
      const ev = {
        id: ++S.seq, t: S.t, type, source: o.source || type.split(".")[0], level: o.level || "info",
        message: o.message || type, data, silent: !!o.silent,
        causeId: cause ? cause.id : null, rootId: cause ? cause.rootId : null, depth,
        chemin: cause ? [...cause.chemin, label] : [label]
      };
      if (!ev.rootId) ev.rootId = ev.id;
      evRefs.set(ev.id, ev);
      if (evRefs.size > 600) evRefs.delete(evRefs.keys().next().value);
      file.push(ev);
      if (!enCours) {
        enCours = true;
        let traites = 0;
        while (file.length && traites++ < 1000) {
          const e = file.shift();
          if (!e.silent) {
            S.journal.push({ id: e.id, t: e.t, type: e.type, source: e.source, level: e.level, message: e.message, rootId: e.rootId, depth: e.depth, chemin: e.chemin });
            if (S.journal.length > 600) S.journal.splice(0, S.journal.length - 600);
          }
          for (const a of abonnes) if (correspond(a.motif, e.type)) { try { a.fn(e); } catch (err) { console.error(err); } }
        }
        file.length = 0;
        enCours = false;
      }
      return ev;
    }
  };
}
const bus = creerBus();

/* ---------- Activité à bord (ce que chaque personne reçoit) ---------- */
function activite(membreId, type, texte, mode) {
  const m = membreId ? S.equipage.find((x) => x.id === membreId) : null;
  S.activite.push({ t: S.t, membre: membreId, nom: m ? m.nom : null, type, texte, mode });
  if (S.activite.length > 150) S.activite.splice(0, S.activite.length - 150);
}

/* ---------- Règles partagées ---------- */
const membre = (id) => S.equipage.find((m) => m.id === id);
const lotParId = (id) => S.armoire.lots.find((l) => l.id === id);
const lotsDispo = () => S.armoire.lots.filter((l) => l.statut === "ok" && l.portions >= 1);
const totalPortions = () => lotsDispo().reduce((s, l) => s + l.portions, 0);
const autonomieRepas = () => totalPortions() / Math.max(1, S.equipage.length * 3);

// Règles strictes : on se base sur l'étiquette du produit (ce que la cuisine connaît)
function motifsIncompatibilite(p, m) {
  const motifs = [];
  const allergies = new Set(m.allergies);
  if (m.maladies.includes("maladie cœliaque")) allergies.add("gluten");
  p.allergenes.filter((a) => allergies.has(a)).forEach((a) => motifs.push("contient " + a));
  m.regimes.forEach((r) => { if (!p.tags.includes(r)) motifs.push("non " + r); });
  return motifs;
}
// Choix d'un lot : produits compatibles, puis « premier périmé, premier sorti »
function choisirLot(m, lots, leger) {
  let cand = lots.filter((l) => motifsIncompatibilite(PRODUITS[l.pid], m).length === 0);
  if (leger) { const l2 = cand.filter((l) => PRODUITS[l.pid].leger); if (l2.length) cand = l2; }
  cand.sort((a, b) => a.peremption - b.peremption || b.portions - a.portions);
  return cand[0] || null;
}
function consoJour(med) {
  return S.infirmerie.consoLog.filter((c) => c.med === med && c.t > S.t - 1440).reduce((s, c) => s + c.qty, 0);
}
function autonomieMed(med) {
  const c = consoJour(med);
  const stock = S.armoire.reserve[med] + S.infirmerie.medbox[med];
  return c > 0 ? stock / c : Infinity;
}

  bus.on("crise.panne-frigo", (e) => {

      if (tot >= 15) A().stockBas[pid] = false;

  bus.on("infirmerie.demande.reappro", (e) => {

  });

    const l = lotParId(e.data.lotId);
    if (!l || l.statut !== "ok") return;
    perte(l, e.data.motif === "allergene" ? "Allergène non déclaré" : "Contamination suspectée");
    const p = Math.round(l.portions);

  });
  bus.on("admin.livraison", (e) => {

    bus.publish("armoire.lot.ajoute", { lotId: id }, { cause: e, level: "ok", message: `Nouveau lot ${id} rangé : ${qty} portions de ${p.nom}`, label: `Lot ${id} rangé` });
  });
  bus.on("serre.demande.graines", (e) => {

      if (A().graines[esp] < G.seuil && !A().grainesBas[esp]) {

    }
  });
  bus.on("admin.graines", (e) => {

    if (A().graines[esp] >= GRAINES[esp].seuil) A().grainesBas[esp] = false;

  });
  bus.on("admin.reappro", (e) => {
    const { med, qty } = e.data;

    bus.publish("armoire.reserve.maj", { med }, { cause: e, level: "ok", message: `Réserve de ${MEDS[med].nom} : +${qty} (total ${A().reserve[med]})`, label: `Réserve ${MEDS[med].nom} +${qty}` });
  });
}
function tickArmoire() {
  const A = S.armoire, f = A.froid;
  const cible = f.panne ? 21 : 4;
  f.temp += (cible - f.temp) * (f.panne ? 0.07 : 0.25) + (rand() - 0.5) * 0.12;
  A.pharma.temp = 19 + (rand() - 0.5) * 0.6;
  if (f.temp > 8 && !f.alerte) {
    f.alerte = true;
    causes.froid = bus.publish("armoire.froid.alerte", {}, { cause: causes.panne, level: "danger", message: `Compartiment réfrigéré à ${f.temp.toFixed(1).replace(".", ",")} °C : chaîne du froid rompue`, label: "Chaîne du froid rompue" });
  }
  if (f.temp <= 6 && f.alerte) {
    f.alerte = false;
    bus.publish("armoire.froid.normal", {}, { level: "ok", message: `Compartiment réfrigéré revenu à ${f.temp.toFixed(1).replace(".", ",")} °C`, label: "Froid rétabli" });
  }
  for (const l of A.lots) {
    if (l.statut !== "ok" || l.portions < 1) continue;
    const p = PRODUITS[l.pid];
    if (p.zone === "froid" && f.temp > 8) {
      l.expo++;
      if (l.expo >= 6) {
        A.pertes.unshift({ t: S.t, lot: l.id, nom: p.nom, portions: Math.round(l.portions), motif: "Chaîne du froid rompue" });
        const qte = Math.round(l.portions);
        l.statut = "perdu"; l.portions = 0;
        causes.perte = bus.publish("armoire.lot.perdu", { lotId: l.id }, { cause: causes.froid, level: "danger", message: `Lot ${l.id} (${p.nom}) jeté : ${qte} portions exposées plus d'une heure au-dessus de 8 °C`, label: `Lot ${l.id} jeté (${qte} portions)` });
      }
    }
    if (S.t > l.peremption) {
      A.pertes.unshift({ t: S.t, lot: l.id, nom: p.nom, portions: Math.round(l.portions), motif: "Date de péremption dépassée" });
      l.statut = "perime"; l.portions = 0;
      causes.perte = bus.publish("armoire.lot.perime", { lotId: l.id }, { level: "warn", message: `Lot ${l.id} (${p.nom}) périmé et retiré`, label: `Lot ${l.id} périmé` });
    }
  }
  A.pertes = A.pertes.slice(0, 30);
}

/* ---------- Module SERRE (cultures, CropGuard, besoins en graines) ---------- */
function demanderGraines(z, cause) {
  const G = GRAINES[z.esp];
  z.demande = true;
  bus.publish("serre.demande.graines", { zone: z.id, esp: z.esp, qty: G.parSemis }, { cause, message: `Zone ${z.id} : demande de ${G.parSemis} graines de ${G.nom.toLowerCase()} à l'armoire`, label: `Demande de graines (zone ${z.id})` });
}
function initSerre() {
  const Z = () => S.serre.zones;
  bus.on("armoire.graines.sorties", (e) => {
    const z = Z().find((x) => x.id === e.data.zone);
    if (!z) return;
    z.etat = "pousse"; z.croissance = 0; z.malade = false; z.demande = false;
    bus.publish("serre.semis", { zone: z.id }, { cause: e, level: "ok", message: `Zone ${z.id} replantée en ${GRAINES[z.esp].nom.toLowerCase()}`, label: `Zone ${z.id} replantée` });
  });
  bus.on("armoire.graines.rupture", (e) => { const z = Z().find((x) => x.id === e.data.zone); if (z) z.demande = "rupture"; });
  bus.on("armoire.graines.maj", (e) => {
    for (const z of Z()) if (z.esp === e.data.esp && z.demande === "rupture") { z.demande = false; demanderGraines(z, e); }
  });
  bus.on("crise.maladie-cultures", (e) => {
    causes.cultures = e;
    const cibles = Z().filter((z) => z.etat === "pousse" && !z.malade).sort(() => rand() - 0.5).slice(0, 2);
    cibles.forEach((z) => { z.malade = true; });
    if (cibles.length) bus.publish("serre.infection", { zones: cibles.map((z) => z.id) }, { cause: e, level: "warn", message: `Champignon sur les zones ${cibles.map((z) => z.id).join(" et ")} (pas encore visible)`, label: "Champignon invisible" });
  });
}
function tickSerre() {
  const SE = S.serre;
  for (const z of SE.zones) {
    if (z.etat === "vide") { if (!z.demande) demanderGraines(z, null); continue; }
    const G = GRAINES[z.esp];
    z.croissance = Math.min(1, z.croissance + (z.malade ? 0.3 : 1) / (G.cycleJ * 144));
    if (!z.malade && rand() < 0.0003) z.malade = true;
    if (z.croissance >= 1) {
      const qty = z.malade ? Math.round(RECOLTE_PORTIONS * 0.4) : RECOLTE_PORTIONS;
      const ev = bus.publish("serre.recolte", { zone: z.id, qty }, { level: "ok", message: `Récolte de la zone ${z.id} (${G.nom.toLowerCase()}) : ${qty} portions de légumes frais`, label: `Récolte zone ${z.id}` });
      SE.recoltes.unshift({ t: S.t, zone: z.id, esp: z.esp, qty }); SE.recoltes = SE.recoltes.slice(0, 12);
      z.etat = "vide"; z.croissance = 0; z.malade = false;
      demanderGraines(z, ev);
    }
  }
  // CropGuard : analyse des photos toutes les heures
  if (S.t - SE.scan >= 60) {
    SE.scan = S.t;
    for (const z of SE.zones) {
      if (z.etat !== "pousse" || !z.malade) continue;
      const G = GRAINES[z.esp];
      const conf = 84 + Math.floor(rand() * 14);
      const ev = bus.publish("serre.cropguard.detection", { zone: z.id, conf }, { cause: causes.cultures, level: "danger", message: `CropGuard : feuilles malades détectées sur la zone ${z.id} (${G.nom.toLowerCase()}), confiance ${conf} %`, label: `CropGuard : zone ${z.id} malade` });
      const perdu = Math.round(RECOLTE_PORTIONS * Math.max(0.2, z.croissance));
      z.etat = "vide"; z.croissance = 0; z.malade = false;
      const ev2 = bus.publish("serre.zone.arrachee", { zone: z.id }, { cause: ev, level: "warn", message: `Zone ${z.id} arrachée pour stopper la maladie : environ ${perdu} portions de récolte perdues`, label: `Zone ${z.id} arrachée` });
      demanderGraines(z, ev2);
    }
  }
}

/* ---------- Module CUISINE (repas, rationnement, compatibilité) ---------- */
function initCuisine() {
  bus.on("armoire.lot.quarantaine", (e) => {
    bus.publish("cuisine.menu.ajuste", {}, { cause: e, message: "Menus recalculés sans le lot retiré", label: "Menus recalculés" });
  });
}
function servirRepas(nomRepas, cause) {
  const C = S.cuisine;
  const ration = C.mode === "rationnement" ? 0.75 : 1;
  const reste = {};
  const servings = [], sans = [];
  let kcal = 0;
  for (const m of S.equipage) {
    const P = S.infirmerie.patients[m.id];
    const dispo = lotsDispo().filter((l) => (reste[l.id] ?? l.portions) >= ration);
    const l = choisirLot(m, dispo, !!(P && P.cond));
    if (!l) { sans.push(m.nom); continue; }
    reste[l.id] = (reste[l.id] ?? l.portions) - ration;
    servings.push({ membre: m.id, lotId: l.id });
    const hp = (S.repasPerso[m.id] = S.repasPerso[m.id] || []);
    hp.unshift({ t: S.t, repas: nomRepas, plat: PRODUITS[l.pid].nom, ration }); if (hp.length > 8) hp.pop();
    kcal += PRODUITS[l.pid].kcal * ration;
  }
  const parLot = {};
  servings.forEach((s) => { parLot[s.lotId] = (parLot[s.lotId] || 0) + ration; });
  activite(null, "repas", `${nomRepas} servi à ${servings.length} membres${sans.length ? `, ${sans.length} sans plat compatible` : ""}`, "cuisine");
  C.dernier = { repas: nomRepas, t: S.t, servis: servings.length, sans, kcal: servings.length ? Math.round(kcal / servings.length) : 0 };
  const ev = bus.publish("cuisine.repas.servi", { repas: nomRepas, servings }, {
    cause, level: sans.length ? "warn" : "info",
    message: `${nomRepas} servi à ${servings.length}/${S.equipage.length} membres${ration < 1 ? " (rations réduites de 25 %)" : ""}`,
    label: `${nomRepas} servi`
  });
  bus.publish("cuisine.retrait", { retraits: Object.entries(parLot).map(([lotId, qty]) => ({ lotId, qty })) }, { cause: ev, silent: true });
  if (sans.length) bus.publish("cuisine.aucun.compatible", { membres: sans }, { cause: ev, level: "danger", message: `Aucun plat compatible en stock pour : ${sans.join(", ")}`, label: "Aucun plat compatible" });
}
function tickCuisine() {
  const C = S.cuisine;
  const prev = (S.t - MIN_PAR_TICK) % 1440, cur = S.t % 1440;
  for (const r of REPAS) {
    if (!(prev < r.h && cur >= r.h)) continue;
    const staffMalade = S.equipage.filter((m) => m.pilier === "Repas" && S.infirmerie.patients[m.id].cond && S.infirmerie.patients[m.id].cond.sev > 0.35).length;
    if (staffMalade >= 2 && !C.attente) {
      C.attente = { repas: r.nom, t: S.t + 60 };
      bus.publish("cuisine.service.retarde", {}, { cause: causes.epidemie, level: "warn", message: `${r.nom} retardé d'une heure : ${staffMalade} membres de l'équipe cuisine malades`, label: `${r.nom} retardé` });
    } else {
      servirRepas(r.nom, null);
    }
  }
  if (C.attente && S.t >= C.attente.t) { const nom = C.attente.repas; C.attente = null; servirRepas(nom, null); }
  const auto = autonomieRepas();
  if (auto < 7 && C.mode === "nominal") {
    C.mode = "rationnement";
    bus.publish("cuisine.mode", { mode: C.mode }, { cause: causes.perte, level: "warn", message: `Autonomie en repas : ${auto.toFixed(1).replace(".", ",")} jours. Passage en rationnement (portions −25 %)`, label: "Rationnement" });
  } else if (auto >= 9 && C.mode === "rationnement") {
    C.mode = "nominal";
    bus.publish("cuisine.mode", { mode: C.mode }, { level: "ok", message: `Autonomie en repas : ${auto.toFixed(1).replace(".", ",")} jours. Retour aux portions normales`, label: "Fin du rationnement" });
  }
}

/* ---------- Module INFIRMERIE (constantes, triage, soins, MedBox) ---------- */
const causePatient = {};
function demander(med, cause) {
  const I = S.infirmerie;
  if (I.demandes[med]) return;
  const qty = Math.max(1, I.seuils[med] * 2 - Math.floor(I.medbox[med]));
  I.demandes[med] = true;
  bus.publish("infirmerie.demande.reappro", { med, qty }, { cause, message: `MedBox sous le seuil : demande de ${qty} × ${MEDS[med].nom} à l'armoire`, label: `Demande MedBox : ${MEDS[med].nom}` });
}
function donner(m, P, med, cause, silencieux = false, mode = "infirmerie") {
  const I = S.infirmerie;
  if (MEDS[med].allergene && m.allergies.includes(MEDS[med].allergene)) {
    bus.publish("infirmerie.contre-indication", { med, membre: m.id }, { cause, level: "warn", message: `${MEDS[med].nom} bloqué pour ${m.nom} : allergie déclarée (${MEDS[med].allergene})`, label: `${MEDS[med].nom} bloqué (allergie)` });
    return false;
  }
  if (I.medbox[med] < 1) {
    if (!I.vide[med]) { I.vide[med] = true; bus.publish("infirmerie.medbox.vide", { med }, { cause, level: "danger", message: `MedBox vide : ${MEDS[med].nom} indisponible pour ${m.nom}`, label: `MedBox vide : ${MEDS[med].nom}` }); }
    demander(med, cause);
    return false;
  }
  I.medbox[med] -= 1;
  P.doses[med] = S.t;
  I.consoLog.push({ t: S.t, med, qty: 1 });
  activite(m.id, "med", MEDS[med].nom, mode);
  const ev = bus.publish("infirmerie.soin", { med, membre: m.id }, { cause, silent: silencieux, message: `${MEDS[med].nom} administré à ${m.nom}`, label: `${MEDS[med].nom} → ${m.nom}` });
  if (I.medbox[med] < I.seuils[med]) demander(med, ev);
  return true;
}
function tomberMalade(m, type, cause, extra = {}) {
  const P = S.infirmerie.patients[m.id];
  if (P.cond && type !== "anaphylaxie") return null;
  if (type === "grippe" && P.immunise) return null;
  P.cond = { type, sev: type === "anaphylaxie" ? 0.95 : type === "intox" ? 0.55 : 0.25, duree: 0, pic: 14 + Math.floor(rand() * 14), bacterien: false, antibio: false, adre: false, ...extra };
  const apres = extra.repas ? ` après le ${extra.repas.toLowerCase()}` : "";
  const msg = type === "grippe" ? `${m.nom} a la grippe` : type === "intox" ? `Intoxication alimentaire : ${m.nom}${apres} (lot ${extra.lotId})` : `Réaction allergique grave : ${m.nom}${apres} (allergène non déclaré : ${extra.allergene})`;
  const ev = bus.publish("infirmerie.cas", { membre: m.id, type }, { cause, level: type === "grippe" ? "warn" : "danger", message: msg, label: msg });
  causePatient[m.id] = ev;
  return ev;
}
function initInfirmerie() {
  const I = () => S.infirmerie;
  bus.on("armoire.reappro.medbox", (e) => { I().medbox[e.data.med] += e.data.qty; I().demandes[e.data.med] = false; I().vide[e.data.med] = false; });
  bus.on("armoire.rupture.med", (e) => { I().demandes[e.data.med] = "rupture"; });
  bus.on("armoire.reserve.maj", (e) => {
    const med = e.data.med;
    if (I().demandes[med] === "rupture" && S.armoire.reserve[med] > 0) { I().demandes[med] = false; if (I().medbox[med] < I().seuils[med]) demander(med, e); }
  });
  bus.on("crise.epidemie", (e) => {
    causes.epidemie = e;
    const sains = S.equipage.filter((m) => !I().patients[m.id].cond);
    for (let k = 0; k < 5 && sains.length; k++) tomberMalade(sains.splice(Math.floor(rand() * sains.length), 1)[0], "grippe", e);
  });
  bus.on("admin.isolement", (e) => { I().isolement = !!e.data.actif; });
  bus.on("cuisine.repas.servi", (e) => {
    for (const s of e.data.servings) {
      const l = lotParId(s.lotId), m = membre(s.membre);
      if (!l || !m) continue;
      if (l.contamine && rand() < 0.75) I().incubations.push({ membre: m.id, type: "intox", t: S.t + 20 + Math.floor(rand() * 3) * 10, lotId: l.id, ref: l.causeRef ?? e.id, repas: e.data.repas });
      const cache = l.allergenesReels.filter((a) => !PRODUITS[l.pid].allergenes.includes(a) && m.allergies.includes(a));
      if (cache.length) I().incubations.push({ membre: m.id, type: "anaphylaxie", t: S.t + MIN_PAR_TICK, lotId: l.id, allergene: cache[0], ref: l.causeRef ?? e.id, repas: e.data.repas });
    }
  });
}
function tickInfirmerie() {
  const I = S.infirmerie;
  // Déclenchement des cas liés aux repas (incubation)
  I.incubations = I.incubations.filter((inc) => {
    if (S.t < inc.t) return true;
    const m = membre(inc.membre);
    if (!m) return false;
    const ev = tomberMalade(m, inc.type, evRefs.get(inc.ref) || null, { lotId: inc.lotId, allergene: inc.allergene, repas: inc.repas });
    if (!ev) return false;
    if (inc.type === "anaphylaxie") {
      bus.publish("infirmerie.suspicion.alimentaire", { lotId: inc.lotId, motif: "allergene" }, { cause: ev, level: "warn", message: `Traçabilité : allergène non déclaré (${inc.allergene}) suspecté dans le lot ${inc.lotId}`, label: `Traçabilité → lot ${inc.lotId}` });
    } else {
      I.casParLot[inc.lotId] = (I.casParLot[inc.lotId] || 0) + 1;
      if (I.casParLot[inc.lotId] === 2) bus.publish("infirmerie.suspicion.alimentaire", { lotId: inc.lotId, motif: "contamination" }, { cause: ev, level: "warn", message: `Traçabilité : 2 cas ont mangé le lot ${inc.lotId}, contamination suspectée`, label: `Traçabilité → lot ${inc.lotId}` });
    }
    return false;
  });
  // Contagion de la grippe
  const grippes = S.equipage.filter((m) => I.patients[m.id].cond && I.patients[m.id].cond.type === "grippe").length;
  if (grippes) {
    const p = 0.0012 * grippes * (I.isolement ? 0.15 : 1);
    for (const m of S.equipage) if (!I.patients[m.id].cond && rand() < p) tomberMalade(m, "grippe", causes.epidemie || null);
  }
  // Évolution, constantes, triage, soins
  const insuline = (S.t - MIN_PAR_TICK) % 1440 < 420 && S.t % 1440 >= 420;
  for (const m of S.equipage) {
    const P = I.patients[m.id];
    const c = P.cond;
    const cause = causePatient[m.id] || null;
    if (c) {
      c.duree++;
      if (c.type === "grippe") {
        if (c.bacterien && !c.antibio) c.sev = Math.min(1, c.sev + 0.01);
        else if (c.duree < c.pic) c.sev = Math.min(0.9, c.sev + 0.035);
        else c.sev -= c.antibio ? 0.03 : 0.02;
        if (!c.bacterien && c.sev > 0.6 && rand() < 0.008) {
          c.bacterien = true;
          bus.publish("infirmerie.surinfection", { membre: m.id }, { cause, level: "warn", message: `Surinfection bactérienne chez ${m.nom} : antibiotique nécessaire`, label: `Surinfection ${m.nom}` });
        }
      } else if (c.type === "intox") {
        c.sev -= (S.t - (P.doses.sro ?? -1e9) < 180) ? 0.03 : 0.012;
      } else if (c.type === "anaphylaxie") {
        c.sev = c.adre ? c.sev - 0.07 : Math.min(1, c.sev + 0.02);
      }
      if (c.sev <= 0.05) {
        if (c.type === "grippe") P.immunise = true;
        P.cond = null;
        bus.publish("infirmerie.guerison", { membre: m.id }, { cause, level: "ok", message: `${m.nom} est guéri(e)`, label: `${m.nom} guéri(e)` });
        delete causePatient[m.id];
      }
    }
    const cc = P.cond;
    const n = () => rand() - 0.5;
    let temp = 36.7 + n() * 0.3, fc = 70 + n() * 6, spo2 = 98 + n() * 1.2;
    if (cc) {
      if (cc.type === "grippe") { temp += cc.sev * 3.2; fc += cc.sev * 35; spo2 -= cc.sev * (cc.bacterien ? 7 : 3); }
      if (cc.type === "intox") { temp += cc.sev * 1.4; fc += cc.sev * 40; spo2 -= cc.sev * 2; }
      if (cc.type === "anaphylaxie") { fc += cc.sev * 60; spo2 -= cc.sev * 16; }
      if (temp > 37 && S.t - (P.doses.paracetamol ?? -1e9) < 360) temp = 37 + (temp - 37) * 0.45;
    }
    P.vitals = { temp: +temp.toFixed(1), fc: Math.round(fc), spo2: Math.round(Math.min(100, spo2)) };
    const v = P.vitals;
    const triage = (v.spo2 < 92 || v.temp >= 39.5 || v.fc >= 125) ? "rouge" : (v.spo2 < 95 || v.temp >= 38 || v.fc >= 100) ? "orange" : "vert";
    if (triage !== P.triage) {
      const avant = P.triage;
      P.triage = triage;
      if (triage === "rouge" || avant === "rouge") bus.publish("infirmerie.triage", { membre: m.id, triage }, { cause, level: triage === "rouge" ? "danger" : "info", message: `${m.nom} passe en triage ${triage}`, label: `${m.nom} : triage ${triage}` });
    }
    // Soins
    if (cc) {
      if (v.temp >= 38.5 && S.t - (P.doses.paracetamol ?? -1e9) >= 360) donner(m, P, "paracetamol", cause);
      if (cc.type === "grippe" && cc.bacterien && !cc.antibio) {
        let med = "amoxicilline";
        if (m.allergies.includes("pénicilline")) {
          bus.publish("infirmerie.contre-indication", { med, membre: m.id }, { cause, level: "warn", message: `Amoxicilline bloquée pour ${m.nom} (allergie à la pénicilline) : azithromycine prescrite à la place`, label: "Amoxicilline bloquée → azithromycine" });
          med = "azithromycine";
        }
        if (donner(m, P, med, cause)) cc.antibio = true;
      }
      if (cc.type === "intox") {
        if (S.t - (P.doses.sro ?? -1e9) >= 120) donner(m, P, "sro", cause);
        if (cc.sev > 0.3 && S.t - (P.doses.ondansetron ?? -1e9) >= 480) donner(m, P, "ondansetron", cause);
      }
      if (cc.type === "anaphylaxie") {
        if (!cc.adre) { if (donner(m, P, "adrenaline", cause)) cc.adre = true; }
        else if (S.t - (P.doses.antihistaminique ?? -1e9) >= 480) donner(m, P, "antihistaminique", cause);
      }
    }
    if (insuline && m.maladies.includes("diabète")) donner(m, P, "insuline", null, true, "traitement quotidien");
    if (!cc && rand() < 0.002 && S.t - (P.doses.paracetamol ?? -1e9) >= 360) donner(m, P, "paracetamol", null, true, "libre-service");
  }
  I.consoLog = I.consoLog.filter((c) => c.t > S.t - 2880);
}

/* ---------- Boucle et commandes ---------- */
function historiser() {
  const h = S.hist, push = (k, v) => { h[k].push(v); if (h[k].length > 144) h[k].shift(); };
  push("froid", +S.armoire.froid.temp.toFixed(1));
  push("malades", S.equipage.filter((m) => S.infirmerie.patients[m.id].cond).length);
  push("autoRepas", +autonomieRepas().toFixed(1));
  push("medbox", Object.values(S.infirmerie.medbox).reduce((a, b) => a + b, 0));
}
function tick() {
  S.t += MIN_PAR_TICK; S.tick++;
  tickArmoire(); tickSerre(); tickCuisine(); tickInfirmerie();
  historiser();
}
function commande(c) {
  const src = { source: "admin" };
  switch (c.cmd) {
    case "pause": S.running = !S.running; bus.publish("admin.simulation", {}, { ...src, message: S.running ? "Simulation relancée" : "Simulation en pause" }); break;
    case "vitesse": S.vitesse = c.args.v; break;
    case "crise":
      if (!CRISES[c.args.nom]) return;
      S.crises.push({ nom: c.args.nom, t: S.t });
      bus.publish("crise." + c.args.nom, {}, { ...src, level: "danger", message: "Crise déclenchée : " + CRISES[c.args.nom].titre, label: "Crise : " + CRISES[c.args.nom].titre });
      break;
    case "reset": {
      const v = S.vitesse, eq = S.equipage;
      S = etatInitial(); S.vitesse = v; S.equipage = eq;
      S.equipage.forEach((m) => { if (!S.infirmerie.patients[m.id]) S.infirmerie.patients[m.id] = { cond: null, vitals: { temp: 36.8, spo2: 98, fc: 72 }, triage: "vert", doses: {} }; });
      evRefs.clear(); for (const k in causes) delete causes[k]; for (const k in causePatient) delete causePatient[k];
      bus.publish("admin.reset", {}, { ...src, level: "ok", message: "Réinitialisation : stocks, infirmerie et cuisine reviennent au nominal" });
      break;
    }
    case "reparer": bus.publish("admin.reparer", {}, { ...src, message: "Intervention : réparation du compresseur demandée", label: "Réparation demandée" }); break;
    case "isolement": bus.publish("admin.isolement", { actif: c.args.actif }, { ...src, level: c.args.actif ? "warn" : "info", message: c.args.actif ? "Isolement des malades activé à l'infirmerie" : "Isolement des malades levé" }); break;
    case "livraison": if (PRODUITS[c.args.pid] && c.args.qty > 0) bus.publish("admin.livraison", { pid: c.args.pid, qty: c.args.qty }, { ...src, message: `Livraison de la ferme : ${c.args.qty} portions de ${PRODUITS[c.args.pid].nom}`, label: "Livraison" }); break;
    case "reappro": if (MEDS[c.args.med] && c.args.qty > 0) bus.publish("admin.reappro", { med: c.args.med, qty: c.args.qty }, { ...src, message: `Production / livraison : ${c.args.qty} × ${MEDS[c.args.med].nom} pour la réserve`, label: "Réserve réapprovisionnée" }); break;
    case "profil": {
      const m = membre(c.args.id);
      if (!m) return;
      m.allergies = c.args.allergies; m.regimes = c.args.regimes; m.maladies = c.args.maladies;
      bus.publish("admin.profil", { membre: m.id }, { ...src, message: `Profil santé de ${m.nom} mis à jour` });
      break;
    }
    case "graines": if (GRAINES[c.args.esp] && c.args.qty > 0) bus.publish("admin.graines", { esp: c.args.esp, qty: c.args.qty }, { ...src, message: `Livraison de graines : ${c.args.qty} graines de ${GRAINES[c.args.esp].nom.toLowerCase()}`, label: "Livraison de graines" }); break;
    case "prise": {
      const m = membre(c.args.id), med = c.args.med, LS = LIBRE_SERVICE[med];
      if (!m || !LS) return;
      const P = S.infirmerie.patients[m.id];
      const ev = bus.publish("equipage.prise", { membre: m.id, med }, { source: "equipage", message: `${m.nom} demande ${MEDS[med].nom} à la MedBox (${c.args.raison || "sans motif"})`, label: `Demande de ${m.nom}` });
      const attente = LS.intervalle - (S.t - (P.doses[med] ?? -1e9));
      let rep;
      if (MEDS[med].allergene && m.allergies.includes(MEDS[med].allergene)) {
        donner(m, P, med, ev, false, "libre-service");
        rep = { ok: false, texte: `Refusé : vous êtes allergique (${MEDS[med].allergene}). Allez voir l'infirmerie, elle vous proposera un autre médicament.` };
      } else if (attente > 0) {
        bus.publish("equipage.prise.refusee", { membre: m.id, med }, { cause: ev, level: "warn", message: `Prise refusée pour ${m.nom} : dernière dose trop récente`, label: "Prise refusée (trop tôt)" });
        rep = { ok: false, texte: `Pas encore : il faut attendre ${LS.intervalle / 60} heures entre deux prises. Prochaine prise possible à ${hhmmM(S.t + attente)}.` };
      } else if (donner(m, P, med, ev, false, "libre-service")) {
        rep = { ok: true, texte: `${MEDS[med].nom} délivré par la MedBox à ${hhmmM(S.t)}. Si ça ne va pas mieux dans quelques heures, passez à l'infirmerie.` };
      } else {
        rep = { ok: false, texte: "La MedBox est vide pour ce médicament. L'armoire a été prévenue et va la remplir : réessayez dans un moment ou allez à l'infirmerie." };
      }
      S.infirmerie.reponses[m.id] = { ...rep, t: S.t, med };
      break;
    }
    case "membre": {
      const nom = String(c.args.nom || "").trim().slice(0, 40);
      if (!nom) return;
      const id = "e" + Date.now().toString(36);
      S.equipage.push({ id, nom, pilier: c.args.pilier || "Pilier central", allergies: c.args.allergies || [], regimes: c.args.regimes || [], maladies: c.args.maladies || [] });
      S.infirmerie.patients[id] = { cond: null, vitals: { temp: 36.8, spo2: 98, fc: 72 }, triage: "vert", doses: {} };
      bus.publish("admin.membre", { membre: id }, { ...src, level: "ok", message: `Nouveau membre enregistré : ${nom}` });
      break;
    }
  }
}
let moteurPret = false;
function initMoteur() {
  if (moteurPret) return;
  initArmoire(); initSerre(); initCuisine(); initInfirmerie();
  moteurPret = true;

/* =====================================================================
   Communication entre les onglets (tableau de bord et console admin)
   Le tableau de bord fait tourner la simulation et publie l'état ;
   la console admin envoie des commandes. Tout passe par le navigateur.
   ===================================================================== */
const MODE = location.hash === "#admin" ? "admin" : location.hash === "#equipage" ? "equip" : "dash";
const TAB_ID = Math.random().toString(36).slice(2);
const K_SNAP = "arka-v3-snap", K_CMD = "arka-v3-cmd", K_LEAD = "arka-v3-leader";
let V = null;           // dernier état reçu (vue)
let leader = false;
const vus = new Set();

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

function devenirLeader() {
  if (MODE !== "dash") return false;
  try {
    const l = JSON.parse(lsGet(K_LEAD) || "null");
    if (!l || Date.now() - l.ts > 3000 || l.id === TAB_ID) { lsSet(K_LEAD, JSON.stringify({ id: TAB_ID, ts: Date.now() })); return true; }
    return false;
  } catch (e) { return true; }
}
function publierSnapshot() {
  const snap = { ts: Date.now(), S };
  V = snap;
  lsSet(K_SNAP, JSON.stringify(snap));
}
function envoyer(cmd, args = {}) {
  const c = { nonce: TAB_ID + Date.now() + Math.random(), cmd, args };
  if (leader) { traiterCommande(c); return; }
  lsSet(K_CMD, JSON.stringify(c));
}
function traiterCommande(c) {
  if (!c || vus.has(c.nonce)) return;
  vus.add(c.nonce);
  commande(c);
  publierSnapshot();
  rendre();
}
window.addEventListener("storage", (e) => {
  if (e.key === K_SNAP && e.newValue && !leader) { try { V = JSON.parse(e.newValue); rendre(); } catch (err) {} }
  if (e.key === K_CMD && e.newValue && leader) { try { traiterCommande(JSON.parse(e.newValue)); } catch (err) {} }
});
window.addEventListener("hashchange", () => location.reload());

function boucle() {
  if (MODE === "dash" && devenirLeader()) {
    if (!leader) {
      leader = true;
      const saved = lsGet(K_SNAP);
      if (saved) { try { const snap = JSON.parse(saved); if (snap && snap.S && snap.S.armoire) S = snap.S; } catch (e) {} }
      rand = mulberry32(Date.now() & 0xffffffff);
      initMoteur();
      if (!S.journal.length) bus.publish("systeme.demarrage", {}, { source: "systeme", level: "ok", message: "ARKA démarré : armoire, cuisine et infirmerie en ligne" });
    }
    if (S.running) tick();
    publierSnapshot();
    rendre();
  } else {
    leader = false;
    rendre();
  }
  const delai = leader && S.running ? 1000 / (S.vitesse || 1) : 1000;
  setTimeout(boucle, delai);
}

const hhmm = (t) => { const m = t % 1440; return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; };

function avecVue(fn) { const sauv = S; S = V.S; try { return fn(); } finally { S = sauv; } }

function sparkline(vals, { min, max, couleur = "#3FC1B0", seuil = null } = {}) {
  if (!vals.length) return `<svg viewBox="0 0 300 100"></svg>`;
  const lo = min ?? Math.min(...vals), hi = max ?? Math.max(...vals, lo + 1);
  const x = (i) => (vals.length === 1 ? 300 : (i / (vals.length - 1)) * 300);
  const y = (v) => 95 - ((v - lo) / (hi - lo || 1)) * 88;
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const ligneSeuil = seuil != null ? `<line x1="0" x2="300" y1="${y(seuil)}" y2="${y(seuil)}" stroke="#E05A4A" stroke-dasharray="4 4" stroke-width="1"/>` : "";
  return `<svg viewBox="0 0 300 100" preserveAspectRatio="none" role="img" aria-label="Courbe sur 24 heures">${ligneSeuil}<polyline points="${pts}" fill="none" stroke="${couleur}" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

function statutGlobal() {
  const rouges = S.equipage.filter((m) => S.infirmerie.patients[m.id].triage === "rouge").length;
  const malades = S.equipage.filter((m) => S.infirmerie.patients[m.id].cond).length;
  const sans = S.cuisine.dernier && S.cuisine.dernier.sans.length;
  if (rouges || S.armoire.froid.alerte || sans) return ["danger", "Critique"];
  if (malades || S.armoire.froid.panne || S.cuisine.mode === "rationnement") return ["warn", "Alerte"];
  return ["ok", "Nominal"];
}
function crisesActives() {
  const a = new Set();
  if (S.armoire.froid.panne) a.add("panne-frigo");
  if (S.armoire.lots.some((l) => l.contamine && l.statut === "ok" && l.portions >= 1) || S.equipage.some((m) => S.infirmerie.patients[m.id].cond?.type === "intox")) a.add("intoxication");
  if (S.armoire.lots.some((l) => l.statut === "ok" && l.portions >= 1 && l.allergenesReels.some((x) => !PRODUITS[l.pid].allergenes.includes(x))) || S.equipage.some((m) => S.infirmerie.patients[m.id].cond?.type === "anaphylaxie")) a.add("etiquetage");
  if (S.equipage.some((m) => S.infirmerie.patients[m.id].cond?.type === "grippe")) a.add("epidemie");
  if (S.armoire.reserve.paracetamol < 10) a.add("rupture");
  if (S.serre.zones.some((z) => z.malade)) a.add("maladie-cultures");
  return a;
}
function prochainRepas() {
  if (S.cuisine.attente) return `${S.cuisine.attente.repas} à ${hhmm(S.cuisine.attente.t)} (retardé)`;
  const cur = S.t % 1440;
  const r = REPAS.find((x) => x.h > cur) || REPAS[0];
  return `${r.nom} à ${hhmm(r.h)}`;
}
function medCritique() {
  let best = null;
  for (const k of Object.keys(MEDS)) { const a = autonomieMed(k); if (!best || a < best.a) best = { k, a }; }
  return best;
}
function cascadesHTML(n, filtreNiveau) {
  const parRacine = new Map();
  for (const e of S.journal) { if (!parRacine.has(e.rootId)) parRacine.set(e.rootId, []); parRacine.get(e.rootId).push(e); }
  let groupes = [...parRacine.values()].reverse();
  if (filtreNiveau) groupes = groupes.filter((g) => g.some((e) => e.level === filtreNiveau));
  groupes = groupes.slice(0, n);
  if (!groupes.length) return `<p class="empty">Aucun événement pour le moment.</p>`;
  const lab = { danger: "Urgent", warn: "Alerte", ok: "Résolu", info: "Info" };
  return groupes.map((g) => {
    const r = g[0];
    const suite = g.slice(1, 14).map((e) => `<div class="step" style="padding-left:${Math.min(e.depth, 6) * 14}px"><span class="when">${hhmm(e.t)}</span><span>${esc(e.message)}</span></div>`).join("");
    const plus = g.length > 14 ? `<div class="step"><span>… ${g.length - 14} autres effets</span></div>` : "";
    const pire = g.some((e) => e.level === "danger") ? "danger" : g.some((e) => e.level === "warn") ? "warn" : r.level;
    return `<div class="cascade"><div class="root"><span class="tag ${pire}">${lab[pire] || "Info"}</span><span>${esc(r.message)}</span><span class="when">${heure(r.t)}</span></div>${suite}${plus}</div>`;
  }).join("");
}

document.addEventListener("click", (e) => {
  const pop = document.getElementById("pop");
  const b = e.target.closest(".info");
  document.querySelectorAll('.info[aria-expanded="true"]').forEach((x) => x.setAttribute("aria-expanded", "false"));
  if (!b) { if (!e.target.closest("#pop")) pop.hidden = true; return; }

function rendreLogin() {
  root.innerHTML = `
    <div class="login">
      <div class="brand" style="margin-bottom:18px">${LOGO.replaceAll("COL", "#14213D")}<div><b>ARKA</b><span>Console d'administration</span></div></div>

        <label for="code">Code administrateur</label>
        <input type="password" id="code" autocomplete="off">
        <span id="login-err" class="err" aria-live="polite"></span>
        <button class="btn" type="submit" style="margin-top:8px">Se connecter</button>
      </form>
    </div>`;
  document.getElementById("f-login").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = document.getElementById("code").value.trim();

let nbMembresAffiches = 0, remplirProfilFn = null;
function majAdmin() {
  const $ = (id) => document.getElementById(id);
  if (!V) { $("a-statut").className = "pill off"; $("a-statut").textContent = "En attente"; $("a-banner").innerHTML = `<div class="card" style="margin-bottom:18px"><b>La simulation ne tourne pas encore.</b> Ouvrez le tableau de bord dans un autre onglet : c'est lui qui fait tourner le vaisseau. Cette console le pilote à distance.</div>`; return; }
  const vieux = Date.now() - V.ts > 4000;
  avecVue(() => {
    const [niv, lib] = statutGlobal();
    $("a-statut").className = "pill " + (vieux ? "off" : niv);
    $("a-statut").textContent = vieux ? "Tableau de bord fermé" : lib;
    $("a-heure").textContent = heure(S.t);
    $("a-banner").innerHTML = vieux ? `<div class="card" style="margin-bottom:18px"><b>Le tableau de bord ne répond plus.</b> Ouvrez-le dans un autre onglet pour relancer la simulation (bouton « Ouvrir le tableau de bord »).</div>` : "";
    $("a-pause").textContent = S.running ? "Mettre en pause" : "Relancer";
    document.querySelectorAll("[data-vit]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.vit === S.vitesse)));
    $("a-isol").setAttribute("aria-pressed", String(S.infirmerie.isolement));
    $("a-isol").textContent = S.infirmerie.isolement ? "Lever l'isolement" : "Isoler les malades";
    const act = crisesActives();
    document.querySelectorAll("[data-crise-box]").forEach((b) => b.classList.toggle("active", act.has(b.dataset.criseBox)));
    const malades = S.equipage.filter((m) => S.infirmerie.patients[m.id].cond).length;
    const mc = medCritique();
    $("a-resume").innerHTML = `Autonomie en repas : <b>${jours(autonomieRepas())} jours</b> · Malades : <b>${malades}</b> · Froid : <b>${S.armoire.froid.temp.toFixed(1).replace(".", ",")} °C</b> · Médicament le plus critique : <b>${esc(MEDS[mc.k].nom)} (${jours(mc.a)} j)</b>`;
    $("a-journal").innerHTML = cascadesHTML(40, filtreJournal);
    if (S.equipage.length !== nbMembresAffiches) {
      const sel = $("p-membre"), avant = sel.value;
      sel.innerHTML = S.equipage.map((m) => `<option value="${m.id}">${esc(m.nom)} · ${esc(m.pilier)}</option>`).join("");
      if (avant && S.equipage.some((m) => m.id === avant)) sel.value = avant;
      nbMembresAffiches = S.equipage.length;
      remplirProfilFn && remplirProfilFn();
    }
  });
}

let loginMonte = false;
function rendreAdmin() {
  if (!adminConnecte()) { if (!loginMonte) { loginMonte = true; adminMonte = false; rendreLogin(); } return; }
  loginMonte = false;
  if (!adminMonte) { nbMembresAffiches = 0; monterAdmin(); return; }
  majAdmin();
}

          <section class="card">
            <h2>Prendre un médicament à la MedBox ${ib(INFO.libre)}</h2>
            <form id="f-prise" novalidate>
              <div class="row" style="align-items:flex-end">
                <div class="field"><label for="e-med">Médicament</label><select id="e-med">${Object.keys(LIBRE_SERVICE).map((k) => `<option value="${k}">${esc(MEDS[k].nom)}</option>`).join("")}</select></div>
                <div class="field"><label for="e-raison">Pourquoi ?</label><select id="e-raison"></select></div>
                <button class="btn" type="submit">Prendre</button>
              </div>
            </form>
            <div id="e-rep" aria-live="polite"></div>
            <p class="muted" style="margin-top:14px">Pour tout autre médicament, l'infirmerie s'occupe de vous : ce qu'elle vous donne s'affiche automatiquement dans votre historique.</p>
          </section>
          <section class="card" id="e-repas"></section>
          <section class="card" id="e-hist"></section>
        </div>
        <section class="card" style="margin-top:18px"><h2>Activité à bord ${ib(INFO.activite)}</h2><div id="e-feed"></div></section>
      </div>
      <p class="foot"><a href="./" target="_blank" rel="noopener" id="e-dash">Tableau de bord du vaisseau</a></p>
    </main>`;
  equipMonte = true;
  const $ = (id) => document.getElementById(id);
  $("e-dash").href = location.href.split("#")[0];
  const raisons = () => { $("e-raison").innerHTML = LIBRE_SERVICE[$("e-med").value].raisons.map((r) => `<option>${esc(r)}</option>`).join(""); };
  $("e-med").onchange = raisons; raisons();
  $("e-moi").onchange = () => { try { sessionStorage.setItem("arka-moi", $("e-moi").value); } catch (e) {} majEquip(); };
  $("f-prise").onsubmit = (e) => {
    e.preventDefault();
    const id = moiId();
    if (!id) return;
    envoyer("prise", { id, med: $("e-med").value, raison: $("e-raison").value });
    $("e-rep").innerHTML = `<div class="rep">Demande envoyée à la MedBox…</div>`;
  };
  majEquip();
}
let nbEquipAffiches = 0;
function majEquip() {
  const $ = (id) => document.getElementById(id);
  if (!V) { $("e-banner").innerHTML = `<div class="card" style="margin-bottom:18px"><b>Le vaisseau n'est pas encore démarré.</b> Ouvrez le tableau de bord dans un autre onglet pour lancer la simulation.</div>`; return; }
  const vieux = Date.now() - V.ts > 4000;
  avecVue(() => {
    $("e-heure").innerHTML = `${heure(S.t)} ${ib(INFO.horloge)}`;
    $("e-banner").innerHTML = vieux ? `<div class="card" style="margin-bottom:18px"><b>Le tableau de bord ne répond plus.</b> Ouvrez-le dans un autre onglet pour relancer la simulation.</div>` : "";
    const sel = $("e-moi");
    if (S.equipage.length !== nbEquipAffiches) {
      sel.innerHTML = `<option value="">Choisissez votre nom…</option>` + S.equipage.map((m) => `<option value="${m.id}">${esc(m.nom)}</option>`).join("");
      nbEquipAffiches = S.equipage.length;
    }
    const id = moiId();
    if (sel.value !== id) sel.value = id;
    const m = S.equipage.find((x) => x.id === id);
    $("e-perso").classList.toggle("hidden", !m);
    if (!m) return;
    const P = S.infirmerie.patients[m.id], v = P.vitals;
    const etat = P.cond
      ? `<p class="big c-${P.triage === "rouge" ? "danger" : "warn"}" style="color:${P.triage === "rouge" ? "#A32D2D" : "#8A4410"}">Vous êtes suivi(e) par l'infirmerie</p><p>Motif : <b>${esc(COND[P.cond.type])}</b>${P.cond.bacterien ? " avec surinfection" : ""}. L'équipe médicale adapte vos repas (plats légers) et vos soins.</p>`
      : `<p class="big" style="color:#1D6F65">Vous allez bien</p><p class="muted">Vos constantes sont normales.</p>`;
    $("e-etat").innerHTML = `
      <h2>Bonjour ${esc(m.nom.split(" ")[0])} ${ib(INFO.triage)}</h2>
      ${etat}
      <div class="row" style="gap:18px;margin-top:10px">
        <div><div class="big">${v.temp.toFixed(1).replace(".", ",")} °C</div><div class="muted">Température ${ib(INFO.tempC)}</div></div>
        <div><div class="big">${v.spo2} %</div><div class="muted">Oxygène ${ib(INFO.spo2)}</div></div>
        <div><div class="big">${v.fc}</div><div class="muted">Battements / min ${ib(INFO.fc)}</div></div>
      </div>
      <h3 style="font-size:15px;margin:18px 0 6px">Mes restrictions ${ib(INFO.restrictions)}</h3>
      <div>${[...m.allergies.map((a) => `<span class="tag danger">Allergie : ${esc(a)}</span>`), ...m.regimes.map((r) => `<span class="tag">${esc(r)}</span>`), ...m.maladies.map((x) => `<span class="tag warn">${esc(x)}</span>`)].join("") || `<span class="muted">Aucune restriction déclarée.</span>`}</div>`;
    const plat = choisirLot(m, lotsDispo(), !!P.cond);
    const hp = S.repasPerso[m.id] || [];
    $("e-repas").innerHTML = `
      <h2>Mes repas ${ib(INFO.prochainPlat)}</h2>
      <p>Prochain repas : <b>${esc(prochainRepas())}</b></p>
      <p>${plat ? `Vous devriez recevoir : <b>${esc(PRODUITS[plat.pid].nom)}</b>, compatible avec vos restrictions.` : `<span style="color:#A32D2D">Aucun plat compatible avec votre profil n'est en stock. La cuisine a été prévenue.</span>`}</p>
      ${S.cuisine.mode === "rationnement" ? `<p class="muted">Les portions sont réduites de 25 % pour que les réserves durent plus longtemps.</p>` : ""}
      <h3 style="font-size:15px;margin:14px 0 6px">Derniers repas reçus</h3>
      ${hp.length ? `<ul class="feed">${hp.slice(0, 5).map((r) => `<li><span class="when">${heure(r.t)}</span><span>${esc(r.repas)} : ${esc(r.plat)}${r.ration < 1 ? " (portion réduite)" : ""}</span></li>`).join("")}</ul>` : `<p class="empty">Pas encore de repas depuis le démarrage.</p>`}`;
    $("e-hist").innerHTML = `<h2>Mes médicaments ${ib(INFO.historique)}</h2>${activiteHTML(10, m.id).replace('<p class="empty">Rien pour le moment.</p>', '<p class="empty">Vous n\'avez reçu aucun médicament.</p>')}`;
    const rep = S.infirmerie.reponses[m.id];
    if (rep && S.t - rep.t <= 60) $("e-rep").innerHTML = `<div class="rep ${rep.ok ? "ok" : "no"}">${esc(rep.texte)}</div>`;
    $("e-feed").innerHTML = activiteHTML(8);
  });
}
function rendreEquip() { if (!equipMonte) { monterEquip(); return; } majEquip(); }

function rendre() { if (MODE === "admin") rendreAdmin(); else if (MODE === "equip") rendreEquip(); else rendreDash(); }

/* ---------- Démarrage ---------- */
document.body.className = MODE === "equip" ? "admin equip" : MODE;
document.title = MODE === "admin" ? "ARKA – Console d'administration" : MODE === "equip" ? "ARKA – Espace équipage" : "ARKA – Tableau de bord du vaisseau";
try { const s = lsGet(K_SNAP); if (s) V = JSON.parse(s); } catch (e) {}
rendre();
boucle();
</script>
</body>
</html>
