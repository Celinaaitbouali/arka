function majAlertes() {
  const $ = (id) => document.getElementById(id);
  if (!V) { $("al-banner").innerHTML = `<div class="banner">Connexion au serveur…</div>`; return; }
  avecVue(() => {
    $("al-heure").innerHTML = `${horlogeBord()} ${ib(INFO.horloge)}`;
    $("al-banner").innerHTML = (Date.now() - V.ts > 5000) ? `<div class="banner">Connexion au serveur perdue : reconnexion en cours…</div>` : "";
    // Le pilier central voit tout ; une même alerte envoyée à deux piliers n'y apparaît qu'une fois
    const unique = (L) => { const vus = new Set(); return L.filter((a) => { const c = a.type + a.message + a.t; if (vus.has(c)) return false; vus.add(c); return true; }); };
    const duPilier = (k) => k === "central" ? unique(S.alertes) : S.alertes.filter((a) => a.pilier === k);
    const actives = (k) => duPilier(k).filter((a) => a.statut !== "resolue");
    const onglets = Object.entries(PILIERS).map(([k, p]) => { const n = actives(k).length; return `<button role="tab" data-pilier="${k}" aria-selected="${pilierSel === k}">${esc(p.nom)}${n ? `<span class="cpt">${n}</span>` : ""}</button>`; }).join("");
    if ($("al-tabs").innerHTML !== onglets) $("al-tabs").innerHTML = onglets;
    $("al-desc").textContent = PILIERS[pilierSel] ? PILIERS[pilierSel].desc : "";
    const L = actives(pilierSel).sort((a, b) => (b.niveau === "danger") - (a.niveau === "danger") || b.tDernier - a.tDernier);
    const R = duPilier(pilierSel).filter((a) => a.statut === "resolue").sort((a, b) => b.tResolu - a.tResolu).slice(0, 12);
    $("al-nb").textContent = L.length ? `${L.length} en cours` : "";
    $("al-nb").className = "tag " + (L.length ? "warn" : "");
    document.title = (L.length ? `(${L.length}) ` : "") + "ARKA – Alertes " + (PILIERS[pilierSel] ? PILIERS[pilierSel].nom : "");
    const cle = pilierSel + JSON.stringify(L.map((a) => [a.id, a.statut, a.nb])) + JSON.stringify(R.map((a) => a.id));
    if (cle === cleAlertesAff) return;
    cleAlertesAff = cle;
    const lab = { danger: "Urgent", warn: "À surveiller" };
    $("al-actives").innerHTML = L.length ? L.map((a) => `<div class="alerte">
        <span class="tag ${a.niveau}">${lab[a.niveau] || "Info"}</span>
        <div class="txt"><div>${esc(a.message)}${a.nb > 1 ? ` <span class="tag">× ${a.nb}</span>` : ""}</div>
          <div class="meta">${heure(a.t)}${pilierSel === "central" ? ` · ${esc(PILIERS[a.pilier] ? PILIERS[a.pilier].nom : a.pilier)}` : ""} · ${a.statut === "nouvelle" ? "<b>Nouvelle</b> : personne ne s'en occupe encore" : `En cours : prise en charge par <b>${esc(a.par)}</b> à ${hhmm(a.tPris)}`}</div></div>
        <div class="row">${a.statut === "nouvelle" ? `<button class="btn sm" data-al="${esc(a.id)}" data-action="prendre">Prendre en charge</button>` : ""}<button class="btn sec sm" data-al="${esc(a.id)}" data-action="resoudre">Marquer comme résolue</button></div>
      </div>`).join("") : `<p class="empty">Aucune alerte à traiter pour ce pilier.</p>`;
    $("al-resolues").innerHTML = R.length ? `<ul class="feed">${R.map((a) => `<li><span class="when">${hhmm(a.tResolu)}</span><span class="tag ok">Résolue</span><span>${esc(a.message)} <span class="c-mut">(${esc(a.motif || "")}${a.par ? " · " + esc(a.par) : ""})</span></span></li>`).join("")}</ul>` : `<p class="empty">Rien pour le moment.</p>`;
  });
}

let invMonte = false, cleInvStruct = "", cleInvHist = "";
const nomCompteur = () => { try { return sessionStorage.getItem("arka-compteur") || ""; } catch (e) { return ""; } };
function monterInventaire() {
  root.innerHTML = `${barreSites("inv")}
    <header>
      <div class="brand">${LOGO.replaceAll("COL", "#14213D")}<div><b>ARKA</b><span>Espace inventaire</span></div></div>
      <div class="clock" id="iv-heure" style="font-size:20px"></div>
    </header>
    <main>
      <p class="intro">À la fin de chaque mois, ARKA ouvre un inventaire physique : l'équipage ou l'administrateur compte tout ce qui est rangé dans l'armoire (repas, médicaments de la réserve et de la MedBox, graines). Les quantités comptées sont comparées au stock du système, puis l'administrateur valide et le stock est corrigé. ${ib(INFO.inventairePhysique)}</p>
      <div id="iv-banner"></div>
      <div id="iv-contenu"></div>
      <section class="card" style="margin-top:18px"><h2>Derniers inventaires physiques ${ib("Les inventaires physiques déjà validés, avec les écarts trouvés entre le stock réel et le système.")}</h2><div id="iv-hist"></div></section>
    </main>`;
  invMonte = true;
  const $ = (id) => document.getElementById(id);
  const zone = $("iv-contenu");
  const nom = () => { const n = document.getElementById("iv-nom"); return n ? n.value.trim() : ""; };
  const exigerNom = () => { if (nom()) return true; $("iv-err").textContent = "Indiquez votre nom avant de compter."; $("iv-nom").focus(); return false; };
  const compter = (id, donnees) => { envoyer("compter", { id, par: nom(), ...donnees }); return new Promise((ok) => setTimeout(ok, 120)); };
  zone.addEventListener("input", (e) => {
    if (e.target.id === "iv-nom") { $("iv-err").textContent = ""; try { sessionStorage.setItem("arka-compteur", e.target.value.trim()); } catch (err) {} }
  });
  zone.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.matches("[data-qte]")) { e.preventDefault(); zone.querySelector(`[data-save="${e.target.dataset.qte}"]`).click(); }
  });
  zone.addEventListener("click", async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.id === "iv-ouvrir") { b.disabled = true; envoyer("ouvrir-comptage"); toast("Inventaire physique lancé"); return; }
    if (b.id === "iv-valider") {
      b.disabled = true;
      envoyer("valider-comptage", { par: nom() || "Administrateur" });
      toast("Inventaire validé : les stocks sont corrigés");
      return;
    }
    if (!exigerNom()) return;
    if (b.dataset.scan) { b.disabled = true; compter(b.dataset.scan, { rfid: true }).finally(() => { b.disabled = false; }); return; }
    if (b.dataset.save) {
      const champ = zone.querySelector(`[data-qte="${b.dataset.save}"]`);
      const q = Number(champ.value);
      const err = zone.querySelector(`[data-err="${b.dataset.save}"]`);
      if (champ.value.trim() === "" || !Number.isInteger(q) || q < 0) { err.textContent = "Nombre entier positif"; champ.focus(); return; }
      err.textContent = "";
      b.disabled = true; compter(b.dataset.save, { qty: q }).finally(() => { b.disabled = false; });
      return;
    }
    if (b.id === "iv-tout") {
      b.disabled = true;
      const restants = V.S.comptage ? V.S.comptage.lignes.filter((l) => l.compte === null).map((l) => l.id) : [];
      for (const id of restants) { try { await compter(id, { rfid: true }); } catch (err) { break; } }
      b.disabled = false;
      toast("Tous les articles restants ont été scannés");
    }
  });
  majInventaire();
}

  avecVue(() => {
    $("iv-heure").innerHTML = `${horlogeBord()} ${ib(INFO.horloge)}`;
    $("iv-banner").innerHTML = (Date.now() - V.ts > 5000) ? `<div class="banner">Connexion au serveur perdue : reconnexion en cours…</div>` : "";
    const C = S.comptage;
    const d = new Date(S.t * 60000);
    const finMois = Math.floor(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1) / 60000) - 1;
    const struct = C ? C.id : "aucun" + adminConnecte();
    if (struct !== cleInvStruct) {
      cleInvStruct = struct;
      if (!C) {
        $("iv-contenu").innerHTML = `<section class="card"><h2>Aucun inventaire physique en cours</h2>
          <p>Le prochain s'ouvrira automatiquement le <b>${dateCourte(finMois)} à minuit</b>, à la fin du mois. Vous recevrez alors une alerte.</p>
          ${adminConnecte() ? `<button class="btn" id="iv-ouvrir">Lancer un inventaire physique maintenant</button>` : `<p class="muted">L'administrateur peut aussi en lancer un à tout moment depuis sa console.</p>`}</section>`;
      } else {
        const groupes = Object.keys(LIB_CAT).map((cat) => {
          const L = C.lignes.filter((l) => l.cat === cat);
          return `<section class="card" style="margin-bottom:18px"><h2>${esc(LIB_CAT[cat])}</h2><div class="scroll"><table class="inv">
            <thead><tr><th>Article</th><th>Quantité comptée</th><th>Résultat</th></tr></thead>
            <tbody>${L.map((l) => `<tr>
              <td><b>${esc(l.nom)}</b><div class="muted" style="font-size:13px">${esc(l.unite)}</div></td>
              <td><div class="row" style="gap:6px;flex-wrap:nowrap"><label class="hidden" for="q-${esc(l.id)}">Quantité de ${esc(l.nom)}</label><input type="number" min="0" step="1" inputmode="numeric" id="q-${esc(l.id)}" data-qte="${esc(l.id)}" style="width:100px">
                <button class="btn sm" data-save="${esc(l.id)}">Enregistrer</button><button class="btn sec sm" data-scan="${esc(l.id)}">Scanner (RFID)</button></div><span class="err" data-err="${esc(l.id)}"></span></td>
              <td data-st="${esc(l.id)}"></td></tr>`).join("")}</tbody></table></div></section>`;
        }).join("");
        $("iv-contenu").innerHTML = `
          <section class="card" style="margin-bottom:18px">
            <h2>${esc(C.titre)}</h2>
            <p class="muted" style="margin-top:-6px">Ouvert le ${esc(heure(C.ouvert))}. Comptez chaque article à la main ou avec le lecteur RFID de l'armoire, puis l'administrateur valide.</p>
            <div class="row" style="align-items:flex-end;margin-bottom:12px">
              <div class="field" style="max-width:320px;flex:1"><label for="iv-nom">Votre nom</label><input type="text" id="iv-nom" maxlength="40" autocomplete="name" placeholder="Qui fait le comptage ?"><span id="iv-err" class="err" aria-live="polite"></span></div>
              <button class="btn sec" id="iv-tout">Scanner tous les articles restants</button>
            </div>
            <div class="row" style="gap:10px"><div class="bar" style="flex:1;height:12px;background:var(--line)"><span id="iv-barre" style="width:0%"></span></div><b id="iv-prog"></b></div>
            <div id="iv-valid" style="margin-top:14px"></div>
          </section>${groupes}`;
        $("iv-nom").value = nomCompteur();
      }
    }
    if (C) {
      const faits = C.lignes.filter((l) => l.compte !== null).length;
      $("iv-barre").style.width = Math.round((faits / C.lignes.length) * 100) + "%";
      $("iv-prog").textContent = `${faits} / ${C.lignes.length} articles comptés`;
      for (const l of C.lignes) {
        const cel = document.querySelector(`[data-st="${CSS.escape(l.id)}"]`);
        if (!cel) continue;
        const e = l.compte === null ? null : l.compte - l.attendu;
        const html = l.compte === null ? `<span class="tag">À compter</span>`
          : `${e === 0 ? `<span class="tag ok">Conforme</span>` : `<span class="tag warn">Écart ${e > 0 ? "+" : ""}${e}</span>`} <span class="muted" style="font-size:13px">${l.compte} comptés${l.rfid ? " (RFID)" : ""} · système ${l.attendu} · ${esc(l.par)} à ${hhmm(l.t)}</span>`;
        if (cel.innerHTML !== html) cel.innerHTML = html;
        const champ = document.querySelector(`[data-qte="${CSS.escape(l.id)}"]`);
        if (champ && l.compte !== null && document.activeElement !== champ && champ.value !== String(l.compte)) champ.value = l.compte;
      }
      const complet = faits === C.lignes.length;
      const valid = adminConnecte()
        ? `<button class="btn" id="iv-valider" ${complet ? "" : "disabled"}>Valider l'inventaire et corriger les stocks</button> ${complet ? "" : `<span class="muted">Il reste ${C.lignes.length - faits} article(s) à compter.</span>`}`
        : `<p class="muted" style="margin:0">${complet ? "<b>Tout est compté.</b> " : ""}La validation est faite par l'administrateur (une fois connecté à la console d'administration, il valide depuis cette page).</p>`;
      if ($("iv-valid").dataset.cle !== valid) { $("iv-valid").dataset.cle = valid; $("iv-valid").innerHTML = valid; }
    }
    const cleH = JSON.stringify(S.comptages.map((b) => b.id));
    if (cleH !== cleInvHist) {
      cleInvHist = cleH;
      $("iv-hist").innerHTML = S.comptages.length ? S.comptages.map((b) => `<div class="cascade"><div class="root"><span class="tag ${b.ecarts.length ? "warn" : "ok"}">${b.ecarts.length ? b.ecarts.length + " écart(s)" : "Aucun écart"}</span><span>${esc(b.titre)}</span><span class="when">validé par ${esc(b.validePar)} le ${esc(heure(b.valideLe))}</span></div>
        <div class="muted" style="font-size:13px;margin-top:4px">${b.articles} articles comptés par ${esc(b.compteurs.join(", "))}${b.rfid ? `, dont ${b.rfid} au lecteur RFID` : ""}</div>
        ${b.ecarts.length ? `<div class="scroll" style="margin-top:8px"><table><thead><tr><th>Article</th><th>Système</th><th>Compté</th><th>Écart</th></tr></thead><tbody>${b.ecarts.map((x) => `<tr><td>${esc(x.nom)} <span class="muted">(${esc(LIB_CAT[x.cat])})</span></td><td>${x.attendu}</td><td>${x.compte}</td><td class="${x.ecart < 0 ? "c-danger" : ""}">${x.ecart > 0 ? "+" : ""}${x.ecart}</td></tr>`).join("")}</tbody></table></div>` : ""}</div>`).join("")
        : `<p class="empty">Aucun inventaire physique validé pour l'instant.</p>`;
    }
  });
}
function rendreInventaire() { if (!invMonte) { monterInventaire(); return; } majInventaire(); }

function rendre() { if (MODE === "admin") rendreAdmin(); else if (MODE === "equip") rendreEquip(); else if (MODE === "alertes") rendreAlertes(); else if (MODE === "inv") rendreInventaire(); else rendreDash(); }

/* ---------- Démarrage ---------- */
document.body.className = MODE === "equip" || MODE === "alertes" || MODE === "inv" ? "admin equip" : MODE;
document.title = MODE === "admin" ? "ARKA – Console d'administration" : MODE === "equip" ? "ARKA – Espace équipage" : MODE === "alertes" ? "ARKA – Alertes des piliers" : MODE === "inv" ? "ARKA – Espace inventaire" : "ARKA – Tableau de bord du vaisseau";
try { const s = lsGet(K_SNAP); if (s) V = JSON.parse(s); } catch (e) {}
rendre();
boucle();
</script>
</body>
</html>
