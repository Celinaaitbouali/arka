<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARKA – Armoire de Ressources Connectée et Autonome</title>
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAgMTIwIiB3aWR0aD0iMTIwIjoiaGVpZ2h0PSIxMjAiPgogIDxlbGxpcHNlIGN4PSI2MCIgY3k9IjY0IiByeD0iNTQiIHJ5PSIxOSIgdHJhbnNmb3JtPSJyb3RhdGUoLTE4IDYwIDY0KSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjRTg4M0FBIiBzdHJva2Utd2lkdGg9IjMiLz4KICA8cGF0aCBkPSJNMzAgOTYgTDYwIDIwIEw5MCA5NiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTQyMTNEIiBzdHJva2Utd2lkdGg9IjlB" type="image/svg+xml">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0B0F17;
      --bg-card: rgba(22, 30, 46, 0.7);
      --bg-card-hover: rgba(30, 41, 64, 0.8);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(56, 189, 248, 0.2);
      
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      
      --primary: #38BDF8;
      --primary-glow: rgba(56, 189, 248, 0.15);
      --orange: #F97316;
      --green: #10B981;
      --red: #EF4444;
      --yellow: #F59E0B;
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      
      --font-display: 'Syne', sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(249, 115, 22, 0.04) 0%, transparent 40%);
    }

    /* --- Sidebar --- */
    aside.sidebar {
      background: rgba(15, 23, 42, 0.9);
      border-right: 1px solid var(--border-color);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      position: sticky;
      top: 0;
      height: 100vh;
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--text-main);
    }
    .brand-logo { width: 42px; height: 42px; filter: drop-shadow(0 0 8px rgba(56,189,248,0.4)); }
    .brand-name {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, #FFF 30%, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav { display: flex; flex-direction: column; gap: 6px; }
    .nav a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    .nav a:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.05);
    }
    .nav a.active {
      background: var(--primary-glow);
      color: var(--primary);
      border-color: var(--border-accent);
      font-weight: 600;
    }

    .badge-count {
      background: var(--orange);
      color: #000;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
    }

    .role-box {
      margin-top: auto;
      background: rgba(255, 255, 255, 0.02);
      padding: 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }
    .role-box label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px; }
    .role-box select {
      width: 100%;
      background: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      outline: none;
    }

    /* --- Main Content --- */
    main {
      padding: 36px 48px;
      max-width: 1300px;
      width: 100%;
      overflow-y: auto;
    }

    header.top-header {
      margin-bottom: 28px;
    }
    h1 {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .intro { color: var(--text-muted); font-size: 15px; }

    /* --- Layout Elements --- */
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 28px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 28px; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      backdrop-filter: blur(10px);
      transition: border-color 0.2s ease;
    }
    .card:hover { border-color: rgba(255, 255, 255, 0.15); }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* KPI Autonomie */
    .kpi-card {
      position: relative;
      overflow: hidden;
    }
    .kpi-val {
      font-family: var(--font-display);
      font-size: 44px;
      font-weight: 800;
      line-height: 1;
      margin: 10px 0 6px;
      color: #FFF;
    }
    .kpi-val small { font-size: 16px; color: var(--text-muted); font-weight: 400; margin-left: 4px; }
    .kpi-lbl { font-size: 13px; color: var(--text-muted); }
    .progress-bar {
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      margin-top: 14px;
      overflow: hidden;
    }
    .progress-bar span {
      display: block;
      height: 100%;
      background: var(--primary);
      border-radius: 99px;
    }

    /* Tableaux */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th {
      color: var(--text-muted);
      font-weight: 500;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    td {
      padding: 14px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
    }
    tr:last-child td { border-bottom: none; }

    /* Tags & Badges */
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;
      gap: 4px;
    }
    .tag.ok { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); }
    .tag.warn { background: rgba(245, 158, 11, 0.15); color: var(--yellow); border: 1px solid rgba(245, 158, 11, 0.3); }
    .tag.danger { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .tag.neutral { background: rgba(255, 255, 255, 0.06); color: var(--text-muted); }

    /* Boutons & Formulaires */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: #000;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
      gap: 8px;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn.secondary {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    .btn.secondary:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.2); }
    .btn.sm { padding: 6px 12px; font-size: 12px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    
    .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 6px; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-main); cursor: pointer; }

    /* Cartes Serres / CropGuard */
    .zone-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .zone-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 16px;
      text-align: center;
    }
    .zone-card.sick { border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.05); }

    /* Alertes & Toast */
    .alert-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .alert-item:last-child { border-bottom: none; }
    
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1E293B;
      color: #FFF;
      border: 1px solid var(--border-accent);
      padding: 14px 20px;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    @media (max-width: 1024px) {
      body { grid-template-columns: 1fr; }
      aside.sidebar { height: auto; position: relative; }
      main { padding: 24px; }
      .grid-3, .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <a class="brand" href="#dashboard">
      <svg class="brand-logo" viewBox="0 0 120 120">
        <ellipse cx="60" cy="64" rx="54" ry="19" transform="rotate(-18 60 64)" fill="none" stroke="#F97316" stroke-width="4"/>
        <path d="M30 96 L60 20 L90 96" fill="none" stroke="#F1F5F9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="44" y1="72" x2="76" y2="72" stroke="#F1F5F9" stroke-width="8" stroke-linecap="round"/>
        <path d="M60 63 C52 56 53 46 60 41 C67 46 68 56 60 63 Z" fill="#10B981"/>
        <circle cx="107" cy="43" r="5" fill="#F97316"/>
      </svg>
      <span class="brand-name">ARKA</span>
    </a>

    <nav class="nav">
      <a href="#dashboard" data-route="dashboard">Vue Générale</a>
      <a href="#medicaments" data-route="medicaments">Infirmerie & Santé</a>
      <a href="#alimentation" data-route="alimentation">Alimentation & Stocks</a>
      <a href="#graines" data-route="graines">Ferme & CropGuard</a>
      <a href="#equipage" data-route="equipage">Équipage</a>
      <a href="#alertes" data-route="alertes">Alertes <span id="alert-count" class="badge-count">0</span></a>
    </nav>

    <div class="role-box">
      <label for="role-select">Poste de contrôle :</label>
      <select id="role-select">
        <option value="admin">Commandement (Admin)</option>
        <option value="medecine">Officier Médical</option>
        <option value="cuisine">Gestionnaire Repas</option>
        <option value="agriculture">Responsable Serres</option>
      </select>
      <button class="btn secondary sm" style="width: 100%; margin-top: 8px;" data-action="reset-data">Réinitialiser les données</button>
    </div>
  </aside>

  <!-- Principal -->
  <main id="app">
    <!-- Le contenu dynamique sera généré ici -->
  </main>

  <div id="toast" class="toast"></div>

  <script>
    // --- DONNÉES PAR DÉFAUT ---
    const ALLERGENES = ["arachide", "gluten", "lactose", "fruits à coque", "œuf", "poisson", "soja", "pénicilline", "aspirine"];
    const REGIMES = ["végétarien", "vegan", "halal"];
    const MALADIES = ["diabète", "maladie cœliaque", "hypertension"];
    const PILIERS = ["Commandement", "Médecine", "Repas", "Agriculture", "Technique"];

    const DEFAULT_DATA = {
      graines: [
        { id: "g1", espece: "Tomate", quantite: 42, seuil: 20 },
        { id: "g2", espece: "Laitue", quantite: 18, seuil: 20 },
        { id: "g3", espece: "Blé", quantite: 120, seuil: 50 },
        { id: "g4", espece: "Pomme de terre", quantite: 35, seuil: 25 },
        { id: "g5", espece: "Soja", quantite: 60, seuil: 30 }
      ],

      zones: [
        { id: "z1", zone: "Serre A1", espece: "Tomate", etat: "saine", confiance: 97 },
        { id: "z2", zone: "Serre A2", espece: "Laitue", etat: "saine", confiance: 94 },
        { id: "z3", zone: "Serre B1", espece: "Blé", etat: "saine", confiance: 99 },
        { id: "z4", zone: "Serre B2", espece: "Pomme de terre", etat: "malade", confiance: 88 },
        { id: "z5", zone: "Serre C1", espece: "Soja", etat: "saine", confiance: 95 }
      ],

      medicaments: [
        { id: "m1", nom: "Paracétamol 500 mg", allergene: null, reserve: 400, medbox: 30, seuilMedbox: 20, conso: [6, 5, 7, 4, 6, 8, 5, 6, 7, 5, 6, 4, 7, 6], dlc: "2027-12-31" },
        { id: "m2", nom: "Amoxicilline 1 g", allergene: "pénicilline", reserve: 90, medbox: 10, seuilMedbox: 8, conso: [1, 0, 2, 1, 1, 0, 2, 1, 1, 2, 1, 0, 1, 2], dlc: "2026-11-15" },
        { id: "m3", nom: "Aspirine 500 mg", allergene: "aspirine", reserve: 150, medbox: 15, seuilMedbox: 10, conso: [2, 1, 2, 3, 1, 2, 2, 1, 3, 2, 1, 2, 2, 1], dlc: "2028-05-20" },
        { id: "m4", nom: "Antihistaminique", allergene: null, reserve: 60, medbox: 8, seuilMedbox: 6, conso: [1, 2, 1, 1, 2, 1, 3, 2, 1, 2, 2, 1, 2, 3], dlc: "2027-08-10" },
        { id: "m5", nom: "Insuline (flacon)", allergene: null, reserve: 24, medbox: 4, seuilMedbox: 3, conso: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5], dlc: "2026-10-30" }
      ],

      aliments: [
        { id: "a1", nom: "Ration pâtes bolognaise", categorie: "Plat", quantite: 80, allergenes: ["gluten"], tags: [], sucre: false },
        { id: "a2", nom: "Curry de lentilles", categorie: "Plat", quantite: 65, allergenes: [], tags: ["végétarien", "vegan", "halal"], sucre: false },
        { id: "a3", nom: "Poulet riz halal", categorie: "Plat", quantite: 50, allergenes: [], tags: ["halal"], sucre: false },
        { id: "a4", nom: "Poisson et purée", categorie: "Plat", quantite: 30, allergenes: ["poisson", "lactose"], tags: [], sucre: false },
        { id: "a5", nom: "Tofu sauté aux légumes", categorie: "Plat", quantite: 40, allergenes: ["soja"], tags: ["végétarien", "vegan", "halal"], sucre: false },
        { id: "a6", nom: "Barre aux cacahuètes", categorie: "Collation", quantite: 120, allergenes: ["arachide"], tags: ["végétarien", "halal"], sucre: true },
        { id: "a7", nom: "Compote de pommes", categorie: "Collation", quantite: 90, allergenes: [], tags: ["végétarien", "vegan", "halal"], sucre: true },
        { id: "a8", nom: "Crackers sans gluten", categorie: "Collation", quantite: 70, allergenes: [], tags: ["végétarien", "vegan", "halal"], sucre: false },
        { id: "a9", nom: "Yaourt nature", categorie: "Dessert", quantite: 60, allergenes: ["lactose"], tags: ["végétarien", "halal"], sucre: false }
      ],

      equipage: [
        { id: "e1", nom: "Lina Moreau", pilier: "Médecine", allergies: ["pénicilline"], regimes: [], maladies: [], notes: "Chef de bord médical" },
        { id: "e2", nom: "Yanis Benali", pilier: "Agriculture", allergies: ["arachide"], regimes: ["halal"], maladies: [], notes: "Responsable hydroponie" },
        { id: "e3", nom: "Sofia Almeida", pilier: "Repas", allergies: ["gluten"], regimes: ["végétarien"], maladies: ["maladie cœliaque"], notes: "" },
        { id: "e4", nom: "Marc Delaunay", pilier: "Technique", allergies: [], regimes: [], maladies: ["diabète"], notes: "Suivi glycémique requis" }
      ],

      alertes: [
        { id: "al1", date: new Date().toISOString(), niveau: "danger", pilier: "Agriculture", message: "CropGuard : Anomalie foliaire détectée en Serre B2." },
        { id: "al2", date: new Date().toISOString(), niveau: "warn", pilier: "Agriculture", message: "Stock de graines de laitue sous le seuil critique." }
      ]
    };

    // --- CHARGEMENT SÉCURISÉ ---
    const STORAGE_KEY = "arka-app-state-v3";
    let data = loadData();
    let currentRole = "admin";
    let stateUI = { memberFilter: "", deliveryStatus: null };

    function loadData() {
      try {
        const local = localStorage.getItem(STORAGE_KEY);
        if (local) {
          const parsed = JSON.parse(local);
          if (parsed && parsed.medicaments && parsed.medicaments.length > 0) {
            return parsed;
          }
        }
      } catch (e) {
        console.warn("Accès au stockage local bloqué, utilisation du stockage mémoire.");
      }
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    function resetData() {
      data = JSON.parse(JSON.stringify(DEFAULT_DATA));
      saveData();
      toast("Données réinitialisées avec succès !");
      router();
    }

    function esc(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function toast(msg) {
      const t = document.getElementById("toast");
      if (!t) return;
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t.timer);
      t.timer = setTimeout(() => t.classList.remove("show"), 3000);
    }

    function addAlert(niveau, pilier, message) {
      data.alertes.unshift({ id: 'al' + Date.now(), date: new Date().toISOString(), niveau, pilier, message });
    }

    function avg(arr) { return arr && arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 1; }
    function daysLeft(m) { const a = avg(m.conso); return a > 0 ? Math.floor((m.reserve + m.medbox) / a) : 999; }
    function canSeeHealth() { return currentRole === "admin" || currentRole === "medecine"; }

    function getIncompatibilities(aliment, member) {
      const reasons = [];
      const allergies = new Set(member.allergies || []);
      if ((member.maladies || []).includes("maladie cœliaque")) allergies.add("gluten");
      
      (aliment.allergenes || []).forEach(a => {
        if (allergies.has(a)) reasons.push(`Allergène: ${a}`);
      });
      (member.regimes || []).forEach(r => {
        if (!(aliment.tags || []).includes(r)) reasons.push(`Non ${r}`);
      });
      if ((member.maladies || []).includes("diabète") && aliment.sucre) {
        reasons.push("Teneur élevée en sucre");
      }
      return reasons;
    }

    // --- VUES & RENDU ---
    function renderDashboard() {
      const minDaysMed = Math.min(...data.medicaments.map(daysLeft));
      const totalFood = data.aliments.reduce((s, a) => s + a.quantite, 0);
      const foodDays = Math.floor(totalFood / Math.max(data.equipage.length * 3, 1));
      const healthyZones = Math.round((data.zones.filter(z => z.etat === "saine").length / data.zones.length) * 100);

      return `
        <header class="top-header">
          <h1>Tableau de bord de survie</h1>
          <p class="intro">Aperçu en temps réel des ressources vitales et de l'autonomie de la station.</p>
        </header>

        <div class="grid-3">
          <div class="card kpi-card">
            <div class="kpi-lbl">Autonomie Médicale Minimale</div>
            <div class="kpi-val">${minDaysMed === 999 ? "∞" : minDaysMed}<small>jours</small></div>
            <div class="progress-bar"><span style="width: ${Math.min(100, (minDaysMed/60)*100)}%"></span></div>
          </div>
          <div class="card kpi-card">
            <div class="kpi-lbl">Réserve d'Alimentation</div>
            <div class="kpi-val">${foodDays}<small>jours</small></div>
            <div class="progress-bar"><span style="width: ${Math.min(100, (foodDays/90)*100)}%"></span></div>
          </div>
          <div class="card kpi-card">
            <div class="kpi-lbl">Santé des Serres (CropGuard)</div>
            <div class="kpi-val">${healthyZones}<small>%</small></div>
            <div class="progress-bar"><span style="width: ${healthyZones}%"></span></div>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <div class="card-title">Dernières Alertes Système</div>
            <div>${data.alertes.slice(0, 4).map(a => `
              <div class="alert-item">
                <span class="tag ${a.niveau}">${a.niveau.toUpperCase()}</span>
                <div>
                  <div style="font-size: 14px;">${esc(a.message)}</div>
                  <div style="font-size: 11px; color: var(--text-muted);">${a.pilier}</div>
                </div>
              </div>
            `).join('') || '<p style="color:var(--text-muted)">Aucune alerte.</p>'}</div>
          </div>

          <div class="card">
            <div class="card-title">Stocks sous le seuil critique</div>
            <div class="table-container">
              <table>
                <thead><tr><th>Ressource</th><th>Actuel</th><th>Seuil</th></tr></thead>
                <tbody>
                  ${data.medicaments.filter(m => m.medbox < m.seuilMedbox).map(m => `
                    <tr><td>MedBox: ${esc(m.nom)}</td><td><span class="tag danger">${m.medbox}</span></td><td>${m.seuilMedbox}</td></tr>
                  `).join('')}
                  ${data.graines.filter(g => g.quantite < g.seuil).map(g => `
                    <tr><td>Graines: ${esc(g.espece)}</td><td><span class="tag warn">${g.quantite}</span></td><td>${g.seuil}</td></tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderMedicaments() {
      const d = stateUI.deliveryStatus;

      return `
        <header class="top-header">
          <h1>Infirmerie & Distribution Médicale</h1>
          <p class="intro">Gestion des stocks MedBox, prévisions d'autonomie et sécurisation de la délivrance.</p>
        </header>

        <div class="card" style="margin-bottom: 24px;">
          <div class="card-title">
            <span>Inventaire & Réserve Active</span>
            <button class="btn secondary sm" data-action="simular-day">Simuler 24h de consommation</button>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Médicament</th>
                  <th>Réserve globale</th>
                  <th>MedBox (Jour)</th>
                  <th>Conso Mts</th>
                  <th>Autonomie</th>
                  <th>DLC</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${data.medicaments.map(m => {
                  const days = daysLeft(m);
                  return `
                    <tr>
                      <td><strong>${esc(m.nom)}</strong></td>
                      <td>${m.reserve} d.</td>
                      <td>
                        ${m.medbox}${m.medbox < m.seuilMedbox ? '<span class="tag danger">Bas</span>' : ''}
                      </td>
                      <td>${avg(m.conso).toFixed(1)} /j</td>
                      <td><span class="tag ${days < 30 ? 'danger' : 'ok'}">${days} j</span></td>
                      <td><span style="font-size:12px; color:var(--text-muted)">${m.dlc}</span></td>
                      <td>
                        <button class="btn secondary sm" data-action="reappro-med" data-id="${m.id}">Recharger MedBox</button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <div class="card-title">Délivrer une prescription</div>
            <div class="form-group">
              <label>Membre de l'équipage</label>
              <select id="deliv-member">
                <option value="">Sélectionner un membre...</option>
                ${data.equipage.map(e => `<option value="${e.id}">${esc(e.nom)}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>Médicament à délivrer</label>
              <select id="deliv-med">
                <option value="">Sélectionner le produit...</option>
                ${data.medicaments.map(m => `<option value="${m.id}">${esc(m.nom)} (${m.medbox} dispo)</option>`).join('')}
              </select>
            </div>
            <button class="btn" data-action="process-deliv">Vérifier & Transférer</button>

            ${d ? `
              <div style="margin-top: 16px; padding: 12px; border-radius: var(--radius-sm); background: ${d.ok ? 'rgba(16,185,129,0.1)' : 'rgba(239,68,68,0.1)'}; border: 1px solid ${d.ok ? 'var(--green)' : 'var(--red)'}">
                <div style="font-weight:600; color:${d.ok ? 'var(--green)' : 'var(--red)'}">${d.ok ? 'Délivrance autorisée' : 'Blocage de sécurité'}</div>
                <div style="font-size:13px; margin-top:4px;">${esc(d.msg)}</div>
              </div>
            ` : ''}
          </div>

          <div class="card">
            <div class="card-title">Protocole Médical de Sécurité</div>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">
              Le système vérifie automatiquement les allergies déclarées dans la fiche de l'équipage avant d'ouvrir le casier MedBox.
            </p>
            <div class="alert-item">
              <span class="tag warn">Règle</span>
              <div style="font-size:13px;">Toute contre-indication bloque la délivrance physique du médicament.</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderAlimentation() {
      const selectedMember = data.equipage.find(e => e.id === stateUI.memberFilter);

      return `
        <header class="top-header">
          <h1>Gestion de l'Alimentation</h1>
          <p class="intro">Contrôle des réserves nutritionnelles et filtrage automatisé selon les profils de santé.</p>
        </header>

        <div class="card" style="margin-bottom:24px;">
          <div class="form-group" style="max-width: 300px;">
            <label>Filtrer pour un membre de l'équipage :</label>
            <select id="alim-member-select">
              <option value="">Toute la réserve (Sans filtre)</option>
              ${data.equipage.map(e => `<option value="${e.id}" ${stateUI.memberFilter === e.id ? 'selected' : ''}>${esc(e.nom)}</option>`).join('')}
            </select>
          </div>

          ${selectedMember ? `
            <div style="padding:12px; background: rgba(56, 189, 248, 0.05); border: 1px solid var(--border-accent); border-radius: var(--radius-sm); margin-bottom:16px;">
              <strong>Profil sélectionné : ${esc(selectedMember.nom)}</strong>
              <div style="font-size:12px; color: var(--text-muted);">
                Allergies : ${selectedMember.allergies.join(', ') \vert{}\vert{} 'Aucune'} \vert{} Régimes : ${selectedMember.regimes.join(', ') || 'Aucun'}
              </div>
            </div>
          ` : ''}

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Produit</th>
                  <th>Catégorie</th>
                  <th>Stock (Rations)</th>
                  <th>Allergènes</th>
                  <th>Compatibilité</th>
                </tr>
              </thead>
              <tbody>
                ${data.aliments.map(a => {
                  let status = `<span class="tag neutral">Standard</span>`;
                  if (selectedMember) {
                    const issues = getIncompatibilities(a, selectedMember);
                    if (issues.length > 0) {
                      status = `<span class="tag danger" title="${issues.join(', ')}">Incompatible</span>`;
                    } else {
                      status = `<span class="tag ok">Compatible</span>`;
                    }
                  }
                  return `
                    <tr>
                      <td><strong>${esc(a.nom)}</strong></td>
                      <td>${esc(a.categorie)}</td>
                      <td>${a.quantite}</td>
                      <td>${a.allergenes.map(x => `<span class="tag warn">${x}</span>`).join(' ') || '<span style="color:var(--text-muted)">Aucun</span>'}</td>
                      <td>${status}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderGraines() {
      return `
        <header class="top-header">
          <h1>Ferme Intelligente & CropGuard</h1>
          <p class="intro">Suivi des cultures hydroponiques assisté par vision artificielle.</p>
        </header>

        <div class="card" style="margin-bottom:24px;">
          <div class="card-title">
            <span>Surveillance des Zones de Culture</span>
            <button class="btn sm" data-action="scan-crop">Lancer un Scan IA CropGuard</button>
          </div>

          <div class="zone-grid">
            ${data.zones.map(z => `
              <div class="zone-card ${z.etat === 'malade' ? 'sick' : ''}">
                <div style="font-size:16px; font-weight:700;">${esc(z.zone)}</div>
                <div style="font-size:12px; color:var(--text-muted); margin-bottom:8px;">${esc(z.espece)}</div>
                <div>
                  <span class="tag ${z.etat === 'malade' ? 'danger' : 'ok'}">${z.etat.toUpperCase()}</span>
                </div>
                <div style="font-size:11px; margin-top:6px; color:var(--text-muted)">IA Confiance: ${z.confiance}\%</div>${z.etat === 'malade' ? `
                  <button class="btn secondary sm" style="margin-top:10px; width:100%" data-action="treat-zone" data-id="${z.id}">Traiter la zone</button>
                ` : ''}
              </div>
            `).join('')}
          </div>
        </div>

        <div class="card">
          <div class="card-title">Banque de Semences (Graines)</div>
          <div class="table-container">
            <table>
              <thead><tr><th>Espèce</th><th>Sachets en réserve</th><th>Seuil Alerte</th><th>Actions</th></tr></thead>
              <tbody>
                ${data.graines.map(g => `
                  <tr>
                    <td><strong>${esc(g.espece)}</strong></td>
                    <td>${g.quantite}</td>
                    <td>${g.seuil}</td>
                    <td><button class="btn secondary sm" data-action="use-seed" data-id="${g.id}">Utiliser 5 sachets</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderEquipage() {
      return `
        <header class="top-header">
          <h1>Équipage & Registre Médical</h1>
          <p class="intro">Gestion des fiches de santé et des restrictions individuelles.</p>
        </header>

        <div class="grid-2">
          <div class="card">
            <div class="card-title">Membres Enregistrés</div>
            <div class="table-container">
              <table>
                <thead><tr><th>Nom</th><th>Poste</th><th>Restrictions</th></tr></thead>
                <tbody>
                  ${data.equipage.map(e => `
                    <tr>
                      <td><strong>${esc(e.nom)}</strong></td>
                      <td>${esc(e.pilier)}</td>
                      <td>
                        ${canSeeHealth() ? `
                          ${e.allergies.map(a => `<span class="tag danger">${a}</span>`).join(' ')}
                          ${e.regimes.map(r => `<span class="tag ok">${r}</span>`).join(' ')}
                          ${e.maladies.map(m => `<span class="tag warn">${m}</span>`).join(' ')}
                        ` : '<span style="color:var(--text-muted)">Confidentiel</span>'}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <div class="card-title">Ajouter un Membre</div>
            <form id="add-member-form">
              <div class="form-group">
                <label>Nom complet</label>
                <input type="text" name="nom" required>
              </div>
              <div class="form-group">
                <label>Pôle / Affiliation</label>
                <select name="pilier" required>
                  ${PILIERS.map(p => `<option value="${p}">${p}</option>`).join('')}
                </select>
              </div>
              
              <div class="form-group">
                <label>Allergies déclarées</label>
                <div class="checkbox-grid">
                  ${ALLERGENES.map(a => `
                    <label class="checkbox-label"><input type="checkbox" name="allergies" value="${a}"> ${a}</label>
                  `).join('')}
                </div>
              </div>

              <div class="form-group">
                <label>Régime spécifique</label>
                <div class="checkbox-grid">
                  ${REGIMES.map(r => `
                    <label class="checkbox-label"><input type="checkbox" name="regimes" value="${r}"> ${r}</label>
                  `).join('')}
                </div>
              </div>

              <button class="btn" type="submit">Enregistrer le membre</button>
            </form>
          </div>
        </div>
      `;
    }

    function renderAlertes() {
      return `
        <header class="top-header">
          <h1>Journal des Alertes</h1>
          <p class="intro">Historique de la télémétrie et des événements du système ARKA.</p>
        </header>

        <div class="card">
          <div class="card-title">
            <span>Historique (${data.alertes.length})</span>
            <button class="btn secondary sm" data-action="clear-alerts">Effacer l'historique</button>
          </div>
          <div>
            ${data.alertes.map(a => `
              <div class="alert-item">
                <span class="tag ${a.niveau}">${a.niveau.toUpperCase()}</span>
                <div style="flex:1">
                  <div>${esc(a.message)}</div>
                  <div style="font-size:11px; color:var(--text-muted)">
                    ${new Date(a.date).toLocaleString('fr-FR')} \vert{} Source :${a.pilier}
                  </div>
                </div>
              </div>
            `).join('') || '<p>Aucune alerte enregistrée.</p>'}
          </div>
        </div>
      `;
    }

    // --- CONTROLEUR & ROUTAGE ---
    const routes = {
      dashboard: renderDashboard,
      medicaments: renderMedicaments,
      alimentation: renderAlimentation,
      graines: renderGraines,
      equipage: renderEquipage,
      alertes: renderAlertes
    };

    function router() {
      const hash = location.hash.replace('#', '') || 'dashboard';
      const renderFn = routes[hash] || renderDashboard;
      document.getElementById("app").innerHTML = renderFn();

      // Navigation Active
      document.querySelectorAll(".nav a").forEach(el => {
        el.classList.toggle("active", el.dataset.route === hash);
      });

      // Mettre à jour le compteur d'alertes
      const alertEl = document.getElementById("alert-count");
      if (alertEl) alertEl.textContent = data.alertes.length;
    }

    // --- ACTIONS INTERACTIVES ---
    document.addEventListener("click", e => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;

      const action = btn.dataset.action;
      const id = btn.dataset.id;

      if (action === "reset-data") {
        resetData();
        return;
      }

      if (action === "reappro-med") {
        const m = data.medicaments.find(x => x.id === id);
        if (m && m.reserve > 0) {
          const add = Math.min(10, m.reserve);
          m.reserve -= add;
          m.medbox += add;
          toast(`Transfert de ${add} d. vers la MedBox (${m.nom})`);
        } else {
          toast("Réserve insuffisante !");
        }
      }

      if (action === "process-deliv") {
        const memberId = document.getElementById("deliv-member").value;
        const medId = document.getElementById("deliv-med").value;

        if (!memberId || !medId) {
          toast("Veuillez sélectionner un membre et un produit.");
          return;
        }

        const member = data.equipage.find(e => e.id === memberId);
        const med = data.medicaments.find(m => m.id === medId);

        if (med.allergene && member.allergies.includes(med.allergene)) {
          stateUI.deliveryStatus = { ok: false, msg: `Contre-indication : ${member.nom} est allergique à (${med.allergene})` };
          addAlert("danger", "Médecine", `TENTATIVE DE DÉLIVRANCE BLOQUÉE : ${med.nom} pour ${member.nom}`);
        } else if (med.medbox < 1) {
          stateUI.deliveryStatus = { ok: false, msg: "Stock MedBox épuisé. Veuillez recharger depuis la réserve." };
        } else {
          med.medbox -= 1;
          stateUI.deliveryStatus = { ok: true, msg: `Délivrance validée. 1 dose de ${med.nom} transférée à ${member.nom}.` };
        }
      }

      if (action === "simular-day") {
        data.medicaments.forEach(m => {
          const used = Math.min(m.medbox, Math.floor(Math.random() * 3) + 1);
          m.medbox -= used;
        });
        toast("Consommation de 24h appliquée.");
      }

      if (action === "scan-crop") {
        let detected = false;
        data.zones.forEach(z => {
          if (Math.random() < 0.3) {
            z.etat = "malade";
            z.confiance = Math.floor(Math.random() * 20) + 80;
            detected = true;
          }
        });
        if (detected) {
          addAlert("danger", "Agriculture", "CropGuard : Nouvelle infection détectée sur les cultures.");
          toast("Alerte CropGuard : Des anomalies ont été détectées !");
        } else {
          toast("Scan terminé : Aucune anomalie sur les serres.");
        }
      }

      if (action === "treat-zone") {
        const z = data.zones.find(x => x.id === id);
        if (z) {
          z.etat = "saine";
          z.confiance = 99;
          toast(`${z.zone} traitée et assainie.`);
        }
      }

      if (action === "use-seed") {
        const g = data.graines.find(x => x.id === id);
        if (g && g.quantite >= 5) {
          g.quantite -= 5;
          toast(`5 sachets de ${g.espece} prélevés.`);
        }
      }

      if (action === "clear-alerts") {
        data.alertes = [];
        toast("Historique des alertes effacé.");
      }

      saveData();
      router();
    });

    document.addEventListener("change", e => {
      if (e.target.id === "role-select") {
        currentRole = e.target.value;
        toast(`Rôle modifié : ${e.target.options[e.target.selectedIndex].text}`);
        router();
      }

      if (e.target.id === "alim-member-select") {
        stateUI.memberFilter = e.target.value;
        router();
      }
    });

    document.addEventListener("submit", e => {
      if (e.target.id === "add-member-form") {
        e.preventDefault();
        const form = new FormData(e.target);
        
        const newMember = {
          id: 'e' + Date.now(),
          nom: form.get("nom"),
          pilier: form.get("pilier"),
          allergies: form.getAll("allergies"),
          regimes: form.getAll("regimes"),
          maladies: []
        };

        data.equipage.push(newMember);
        saveData();
        toast(`Membre ${newMember.nom} enregistré !`);
        router();
      }
    });

    // --- INITIALISATION ---
    window.addEventListener("hashchange", router);
    window.addEventListener("DOMContentLoaded", router);
    window.addEventListener("load", router);
  </script>
</body>
</html>
